<!DOCTYPE html>
<html lang="es">
<head>
    <script>
      (function() {
        const themes = {
          light: {
            '--primary': '#d946a6',
            '--primary-dark': '#c2348f',
            '--secondary': '#c084fc',
            '--bg-gradient': '#ffffff',
            '--surface': '#ffffff',
            '--surface-variant': '#f3e8f8',
            '--text-primary': '#1e293b',
            '--text-secondary': '#64748b',
            '--text-disabled': '#94a3b8',
            '--border': '#e2e8f0',
            '--shadow-sm': '0 1px 2px 0 rgba(0, 0, 0, 0.05)',
            '--shadow-md': '0 4px 6px -1px rgba(0, 0, 0, 0.1)',
            '--shadow-lg': 'none',
            '--shadow-xl': 'none',
            '--navbar-bg': 'rgba(255, 255, 255, 0.95)',
            '--navbar-shadow': '0 2px 20px rgba(249, 168, 212, 0.2)',
            '--navbar-border': 'rgba(249, 168, 212, 0.1)',
            '--sidebar-bg': '#ffffff',
            '--sidebar-hover': '#f9a8d4',
            '--sidebar-text': '#334155',
            '--sidebar-divider': '#e2e8f0',
            '--btn-primary-bg': 'linear-gradient(135deg, #f9a8d4 0%, #ec4899 100%)',
            '--btn-primary-hover': 'linear-gradient(135deg, #f472b6 0%, #db2777 100%)',
            '--info': '#3b82f6',
            '--success': '#10b981',
            '--warning': '#f59e0b',
            '--error': '#ef4444'
          },
          dark: {
            '--primary': '#ec4899',
            '--primary-dark': '#db2777',
            '--secondary': '#f472b6',
            '--bg-gradient': '#404041',
            '--surface': '#1e2128',
            '--surface-variant': '#2d3139',
            '--text-primary': '#e4e4e7',
            '--text-secondary': '#a1a1aa',
            '--text-disabled': '#71717a',
            '--border': '#3f3f46',
            '--shadow-sm': '0 1px 2px 0 rgba(0, 0, 0, 0.3)',
            '--shadow-md': '0 4px 6px -1px rgba(0, 0, 0, 0.4)',
            '--shadow-lg': 'none',
            '--shadow-xl': 'none',
            '--navbar-bg': 'rgba(30, 33, 40, 0.95)',
            '--navbar-shadow': '0 2px 20px rgba(0, 0, 0, 0.3)',
            '--navbar-border': 'rgba(63, 63, 70, 0.3)',
            '--sidebar-bg': '#1e2128',
            '--sidebar-hover': '#ec4899',
            '--sidebar-text': '#e4e4e7',
            '--sidebar-divider': '#3f3f46',
            '--btn-primary-bg': 'linear-gradient(135deg, #ec4899 0%, #f472b6 100%)',
            '--btn-primary-hover': 'linear-gradient(135deg, #db2777 0%, #ec4899 100%)',
            '--info': '#ec4899',
            '--success': '#34d399',
            '--warning': '#fbbf24',
            '--error': '#f87171'
          }
        };

        const currentTheme = localStorage.getItem('theme') || 'light';
        const themeColors = themes[currentTheme];
        
        const root = document.documentElement;
        Object.entries(themeColors).forEach(([property, value]) => {
          root.style.setProperty(property, value);
        });
      })();
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="Styles/HideScrollbar.css">
  <link rel="stylesheet" href="Styles/AntiFlash.css">
  <link rel="stylesheet" href="Styles/PageLoader.css">
  <link rel="stylesheet" href="Styles/NavbarSkeleton.css">
    
    <title>Agregar Justificación</title>
    <link rel="icon" type="image/jpeg" href="img/Logo.jpg">
    <link rel="stylesheet" href="Styles/AgregarJustificacion.css">
    
    <script src="JavaScript/theme.js"></script>
    
    <script src="JavaScript/i18n.js"></script>
</head>
<body>
   
    
    <div id="navbar"></div>
    
    
    
    <div class="menu-overlay" id="menuOverlay" onclick="closeMenu()"></div>
    
    <div class="modern-form-container">
      <div class="form-header">
        <a href="HorasMensuales.html" class="back-button">
          <i class="bi bi-arrow-left"></i>
        </a>
        <div class="form-title">
          <h2><i class="bi bi-file-earmark-text"></i> <span data-i18n="dashboard.addJustification">Agregar Justificación</span></h2>
          <p data-i18n="hours.registerJustificationAbsence">Registra una justificación para ausencias o faltas</p>
        </div>
      </div>
      
      <div class="form-card">
        <form id="addJustificacionForm" class="form-step">
          <div class="step-content">
            <div class="step-header">
              <h3><i class="bi bi-calendar-event"></i> <span data-i18n="hours.justificationInformation">Información de Justificación</span></h3>
              <p data-i18n="hours.completeJustificationData">Completa los datos de la justificación</p>
            </div>
            
            <div class="date-selection-grid">
              <div class="input-group">
                <label class="form-label" for="anio">
                  <i class="bi bi-calendar3"></i> <span data-i18n="common.year">Año</span>
                </label>
                <input type="number" id="anio" name="anio" min="2000" max="2100" class="form-input modern-input" required>
              </div>
              
              <div class="input-group">
                <label class="form-label" for="mes">
                  <i class="bi bi-calendar2-month"></i> <span data-i18n="common.month">Mes</span>
                </label>
                <select id="mes" name="mes" class="form-input modern-select" required>
                  <option value="" data-i18n="common.selectMonth">Seleccione un mes</option>
                  <option value="1" data-i18n="month.1">Enero</option>
                  <option value="2" data-i18n="month.2">Febrero</option>
                  <option value="3" data-i18n="month.3">Marzo</option>
                  <option value="4" data-i18n="month.4">Abril</option>
                  <option value="5" data-i18n="month.5">Mayo</option>
                  <option value="6" data-i18n="month.6">Junio</option>
                  <option value="7" data-i18n="month.7">Julio</option>
                  <option value="8" data-i18n="month.8">Agosto</option>
                  <option value="9" data-i18n="month.9">Septiembre</option>
                  <option value="10" data-i18n="month.10">Octubre</option>
                  <option value="11" data-i18n="month.11">Noviembre</option>
                  <option value="12" data-i18n="month.12">Diciembre</option>
                </select>
              </div>
              
              <div class="input-group">
                <label class="form-label" for="dia">
                  <i class="bi bi-calendar-day"></i> <span data-i18n="common.day">Día</span>
                </label>
                <input type="number" id="dia" name="dia" min="1" max="31" class="form-input modern-input" required>
              </div>
            </div>

            <div class="standard-input">
              <label class="form-label" for="Motivo_Falla">
                <i class="bi bi-exclamation-triangle"></i> <span data-i18n="hours.failureReason">Motivo de Falla</span>
              </label>
              <input type="text" id="Motivo_Falla" name="Motivo_Falla" required>
            </div>

            <div class="standard-input">
              <label class="form-label" for="Tipo_Justificacion">
                <i class="bi bi-bookmark"></i> <span data-i18n="hours.justificationType">Tipo de Justificación</span>
              </label>
              <input type="text" id="Tipo_Justificacion" name="Tipo_Justificacion" required>
            </div>

            <div class="input-group">
              <label class="form-label" for="Monto_Compensario" style="text-align: center;">
                <i class="bi bi-currency-dollar"></i> <span data-i18n="hours.compensatoryAmount">Monto Compensatorio</span>
              </label>
              <input type="number" id="Monto_Compensario" name="Monto_Compensario" step="0.01" class="monto-input" placeholder="0.00" required>
            </div>
            
            <div id="msg-estado"></div>
          </div>
          
        </form>
        
        <div class="form-navigation">
          <a href="HorasMensuales.html" class="btn btn-secondary">
            <i class="bi bi-arrow-left"></i>
            <span data-i18n="common.back">Volver</span>
          </a>
          <button type="submit" form="addJustificacionForm" class="btn btn-primary">
            <i class="bi bi-check-circle"></i>
            <span data-i18n="hours.saveJustification">Guardar Justificación</span>
          </button>
        </div>
      </div>
    </div>
    
    <div class="success-modal" id="successModal">
      <div class="success-content">
        <div class="success-animation">
          <div class="checkmark-circle">
            <i class="bi bi-check-lg checkmark"></i>
          </div>
        </div>
        <h3 data-i18n="hours.justificationSaved">¡Justificación Guardada!</h3>
        <p data-i18n="hours.justificationRegisteredSuccessfully">Tu justificación ha sido registrada correctamente.</p>
        <button class="btn btn-primary" onclick="goToHorasMensuales()">
          <span data-i18n="hours.viewMonthlyHours">Ver Horas Mensuales</span>
        </button>
      </div>
    </div>
    
      <script src="JavaScript/universal-loader.js"></script>
  <script src="JavaScript/navbar-skeleton.js"></script>
  <script src="JavaScript/page-loader.js"></script>
  <script src="JavaScript/config.js"></script>
    <script src="JavaScript/loader.js"></script>
    <script src="JavaScript/navbar-functions.js"></script>
    <script src="JavaScript/mobile-navbar.js"></script>
    <script src="JavaScript/AgregarJustificacion.js"></script>
    <script src="JavaScript/dashboard.js"></script>
    <script src="JavaScript/Navbar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
