    <div class="header">
        <h2>Agregar Justificación</h2>
    </div>
    <div class="form-container">
      <form class="add-justificacion-form" id="addJustificacionForm">
        <label for="anio">Año:</label>
        <input type="number" id="anio" name="anio" min="2000" max="2100" required>

        <label for="mes">Mes:</label>
        <select id="mes" name="mes" required>
          <option value="">Seleccione un mes</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
          <option value="6">6</option>
          <option value="7">7</option>
          <option value="8">8</option>
          <option value="9">9</option>
          <option value="10">10</option>
          <option value="11">11</option>
          <option value="12">12</option>
        </select>


  <label for="dia">Día:</label>
  <input type="number" id="dia" name="dia" min="1" max="31" required>

  <label for="Motivo_Falla">Motivo de Falla:</label>
  <input type="text" id="Motivo_Falla" name="Motivo_Falla" required>

        <label for="Tipo_Justificacion">Tipo de Justificación:</label>
        <input type="text" id="Tipo_Justificacion" name="Tipo_Justificacion" required>

        <label for="Monto_Compensario">Monto Compensatorio:</label>
        <input type="number" id="Monto_Compensario" name="Monto_Compensario" step="0.01" required>

        <button type="submit" class="btn">Guardar Justificación</button>
      <style>
        .btn {
          background: #1976d2 !important;
          color: #fff !important;
          border-radius: 18px !important;
          font-size: 0.95rem !important;
          padding: 8px 20px !important;
          min-width: 0;
          box-shadow: 0 2px 8px rgba(25,118,210,0.08);
          border: none;
        }
        .btn:hover {
          background: #115293 !important;
        }
      </style>
      </form>

    <script src="JavaScript/config.js"></script>
    <script src="JavaScript/dashboard.js"></script>
    <script src="JavaScript/loader.js"></script>
    <script>
      // Set default year and month

      (function setDefaultYearMonthDay() {
        const now = new Date();
        document.getElementById('anio').value = now.getFullYear();
        document.getElementById('mes').value = (now.getMonth() + 1).toString();
        document.getElementById('dia').value = now.getDate();
      })();

      document.getElementById('addJustificacionForm').onsubmit = async function(e) {
        e.preventDefault();
        const form = e.target;
        const formData = new FormData(form);
        // Mostrar mensaje de estado
        let msg = document.getElementById('msg-estado');
        if (!msg) {
          msg = document.createElement('div');
          msg.id = 'msg-estado';
          msg.style.marginTop = '1rem';
          msg.style.fontWeight = 'bold';
          form.parentNode.appendChild(msg);
        }
        msg.textContent = 'Enviando...';
        msg.style.color = '#555';
        try {
          const token = localStorage.getItem('access_token');
          if (!token) {
            msg.textContent = 'No autenticado. Por favor, inicie sesión.';
            msg.style.color = 'red';
            setTimeout(() => { window.location.href = 'index.html'; }, 1500);
            return;
          }
          // Convertir FormData a objeto para JSON
          const data = {};
          formData.forEach((value, key) => { data[key] = value; });
          const response = await fetch(API_URLS.cooperativa.horasJustificacion(), {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': 'Bearer ' + token
            },
            body: JSON.stringify(data)
          });
          if (response.ok) {
            msg.textContent = '¡Justificación registrada exitosamente!';
            msg.style.color = 'green';
            setTimeout(() => { window.location.href = 'HorasMensuales.html'; }, 1200);
          } else {
            let errorMsg = 'Error al registrar justificación';
            try {
              const text = await response.text();
              const data = JSON.parse(text);
              if (data && data.error) errorMsg += ': ' + data.error;
              else errorMsg += ': ' + text;
            } catch {
              // Si no es JSON
            }
            msg.textContent = errorMsg;
            msg.style.color = 'red';
          }
        } catch (err) {
          msg.textContent = 'Error de conexión con el servidor';
          msg.style.color = 'red';
          console.error('Error de red o JS:', err);
        }
      };
    </script>
</body>
