<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ver Novedad</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="styles_tabla.css">
    <style>
      /* Sombra para el texto del header */
      .header h2 {
        text-shadow: 2px 2px 8px rgba(0,0,0,0.3);
      }
      /* Sticker de salida */
      .exit-sticker {
        position: absolute;
        top: 20px;
        right: 30px;
        background: #ff5252;
        color: #fff;
        padding: 10px 18px;
        border-radius: 30px 10px 30px 10px;
        font-weight: bold;
        font-size: 1rem;
        box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        cursor: pointer;
        transition: background 0.2s;
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .exit-sticker:hover {
        background: #e53935;
      }
      .exit-sticker .emoji {
        font-size: 1.2em;
      }
      /* Para asegurar que el header tenga posición relativa */
      .header {
        position: relative;
      }
    </style>
</head>
<body>
  <div id="navbar"></div>
  <div>
  <div class="header">
    <h2 id="tituloNovedad">Novedad</h2>
    <div class="exit-sticker" onclick="window.location.href='Novedades.html'">
      <span class="emoji">🚪</span> Salir
    </div>
  </div>
  <table class="novedad-header-table">
    <tr>
      <th id="fechaNovedad" style="text-align:left; border-radius: 10px 0 0 0;"></th>
      <th id="subtituloNovedad" style="text-align:center; border-radius: 0 10px 0 0;"></th>
    </tr>
    <tr class="novedad-descripcion-row">
      <td colspan="2" id="descripcionNovedad"></td>
    </tr>
  </table>
    </div>
<script src="JavaScript/VerNovedades.js"></script>
  <script src="JavaScript/dashboard.js"></script>
  <script src="JavaScript/loader.js"></script>
</body>
</html>
