<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Detalle de Factura</title>
  <link rel="icon" type="image/jpeg" href="img/Logo.jpg">
  
  <style id="theme-vars">
    :root {
      --primary: #ec4899;
      --secondary: #a855f7;
      --primary-rgb: 236, 72, 153;
      --primary-light: #f472b6;
      --primary-dark: #db2777;
      --surface: #1e2128;
      --surface-variant: #282c34;
      --surface-hover: #2d3139;
      --bg-gradient: linear-gradient(135deg, #1e2128 0%, #282c34 100%);
      --text-primary: #e4e4e7;
      --text-secondary: #d1d5db;
      --text-muted: #9ca3af;
      --border: #3f3f46;
      --shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.4);
      --shadow-lg: none;
      --shadow-xl: none;
      --success: #10b981;
      --warning: #f59e0b;
      --error: #ef4444;
      --info: #ec4899;
      --btn-primary-bg: #ec4899;
      --btn-primary-hover: #f472b6;
      --navbar-bg: rgba(30, 33, 40, 0.95);
      --navbar-border: rgba(63, 63, 70, 0.5);
      --navbar-shadow: 0 4px 12px rgba(0, 0, 0, 0.4);
      --header-bg: linear-gradient(135deg, #be185d 0%, #ec4899 100%);
      --sidebar-bg: #1e2128;
      --sidebar-header-bg: linear-gradient(135deg, #be185d 0%, #ec4899 100%);
      --sidebar-hover: rgba(236, 72, 153, 0.15);
    }
  </style>
  <script>
    (function() {
      const savedTheme = localStorage.getItem('theme') || 'dark';
      if (savedTheme === 'light') {
        const lightTheme = {
          '--primary': '#d946a6',
          '--secondary': '#c084fc',
          '--primary-rgb': '217, 70, 166',
          '--primary-light': '#f3e8f8',
          '--primary-dark': '#b8388a',
          '--surface': '#ffffff',
          '--surface-variant': '#f8f9fa',
          '--surface-hover': '#f0f0f0',
          '--bg-gradient': '#ffffff',
          '--text-primary': '#1f2937',
          '--text-secondary': '#6b7280',
          '--text-muted': '#9ca3af',
          '--border': '#e5e7eb',
          '--shadow': '0 2px 8px rgba(0, 0, 0, 0.1)',
          '--shadow-sm': '0 1px 2px rgba(0, 0, 0, 0.05)',
          '--shadow-md': '0 4px 6px rgba(0, 0, 0, 0.1)',
          '--shadow-lg': 'none',
          '--shadow-xl': 'none',
          '--success': '#10b981',
          '--warning': '#f59e0b',
          '--error': '#ef4444',
          '--info': '#3b82f6',
          '--btn-primary-bg': '#d946a6',
          '--btn-primary-hover': '#b8388a',
          '--navbar-bg': 'rgba(255, 255, 255, 0.95)',
          '--navbar-border': 'rgba(229, 231, 235, 0.5)',
          '--navbar-shadow': '0 4px 12px rgba(0, 0, 0, 0.1)',
          '--header-bg': 'linear-gradient(135deg, #f9a8d4 0%, #c084fc 100%)',
          '--sidebar-bg': '#ffffff',
          '--sidebar-header-bg': 'linear-gradient(135deg, #f9a8d4 0%, #c084fc 100%)',
          '--sidebar-hover': '#fce7f3'
        };
        Object.entries(lightTheme).forEach(([key, value]) => {
          document.documentElement.style.setProperty(key, value);
        });
      }
    })();
  </script>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
  
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="Styles/HideScrollbar.css">
  <link rel="stylesheet" href="Styles/AntiFlash.css">
  <link rel="stylesheet" href="Styles/PageLoader.css">
  <link rel="stylesheet" href="Styles/NavbarSkeleton.css">
  
  <script src="JavaScript/i18n.js"></script>
  
  <link rel="stylesheet" href="Styles/FacturaDetalle.css">
</head>
<body>

  <div id="navbar"></div>

  <div class="container">
    <div class="row justify-content-center w-100">
      <div class="col-12">
        <div class="detail-header-card">
          <div class="d-flex align-items-center justify-content-between flex-wrap gap-3">
            <div class="d-flex align-items-center gap-3">
              <div class="back-button" onclick="window.location.href='Comprobantes.html'">
                <i class="bi bi-arrow-left"></i>
              </div>
              <div>
                <h1 class="page-title">
                  <i class="bi bi-receipt"></i> <span data-i18n="invoice.detail">Detalle de Comprobante</span>
                </h1>
                <p class="page-subtitle" data-i18n="invoice.viewReceiptDetails">Información completa de tu factura</p>
              </div>
            </div>
            <div class="action-buttons d-none d-md-flex">
              <button class="btn-action" id="downloadBtn">
                <i class="bi bi-download"></i>
                <span data-i18n="invoice.downloadReceipt">Descargar</span>
              </button>
            </div>
          </div>
        </div>

        <div class="row g-4">
          <div class="col-12 col-lg-6">
            <div class="detail-card">
              <div class="card-header">
                <div class="header-icon">
                  <i class="bi bi-info-circle"></i>
                </div>
                <div>
                  <h3 class="card-title" data-i18n="invoice.receiptDetails">Información del Comprobante</h3>
                  <p class="card-subtitle" data-i18n="invoice.receiptImage">Detalles de la factura</p>
                </div>
              </div>
              <div class="card-body">
                <div id="factura-detalle" class="detail-list">
                </div>
              </div>
            </div>
          </div>

          <div class="col-12 col-lg-6">
            <div class="detail-card image-card">
              <div class="card-header">
                <div class="header-icon">
                  <i class="bi bi-file-earmark-image"></i>
                </div>
                <div>
                  <h3 class="card-title" data-i18n="payments.receipt">Comprobante</h3>
                  <p class="card-subtitle" data-i18n="invoice.receiptImage">Imagen del documento</p>
                </div>
              </div>
              <div class="card-body">
                <div class="image-container">
                  <div id="factura-imagen" class="image-content">
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="mobile-actions d-md-none">
          <button class="btn-mobile-action" id="downloadBtnMobile">
            <i class="bi bi-download"></i>
            <span>Descargar Comprobante</span>
          </button>
        </div>
      </div>
    </div>
  </div>

    <script src="JavaScript/universal-loader.js"></script>
  <script src="JavaScript/navbar-skeleton.js"></script>
  <script src="JavaScript/page-loader.js"></script>
  <script src="JavaScript/config.js"></script>
  <script src="JavaScript/loader.js"></script>
  <script src="JavaScript/navbar-functions.js"></script>
  <script src="JavaScript/mobile-navbar.js"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="JavaScript/factura_detalle.js"></script>
  <script src="JavaScript/dashboard.js"></script>
  <script src="JavaScript/Navbar.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
