<body>
  <style>
    /* Global Box Sizing */
    *, *::before, *::after {
      box-sizing: border-box;
    }
    
    html, body {
      overflow-x: hidden;
      width: 100%;
    }
    
    /* CSS Variables */
    :root {
      --primary: #ec4899;
      --primary-dark: #be185d;
      --primary-light: #f9a8d4;
      --secondary: #64748b;
      --surface: #ffffff;
      --background: #fafafa;
      --border: #e2e8f0;
      --text-primary: #1e293b;
      --text-secondary: #64748b;
      --success: #10b981;
      --error: #ef4444;
      --warning: #f59e0b;
      --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
      --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
    }

    /* Mobile Navigation Styles */
    .mobile-nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      padding: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
      box-shadow: 0 2px 20px rgba(249, 168, 212, 0.2);
      border-bottom: 1px solid rgba(249, 168, 212, 0.1);
    }
    
    .menu-btn {
      background: none;
      border: none;
      font-size: 1.5rem;
      color: #ec4899;
      cursor: pointer;
      padding: 0.5rem;
      border-radius: 8px;
      transition: all 0.2s ease;
    }
    
    .menu-btn:hover {
      background: rgba(236, 72, 153, 0.1);
    }
    
    .logo-mobile {
      height: 40px;
      width: auto;
    }

    /* Sidebar Menu Styles */
    .sidebar-menu {
      position: fixed;
      top: 0;
      left: -300px;
      width: 300px;
      height: 100vh;
      background: var(--surface);
      box-shadow: var(--shadow-xl);
      z-index: 1001;
      transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      overflow-y: auto;
    }
    
    .sidebar-menu.active {
      left: 0;
    }
    
    .sidebar-header {
      padding: 2rem 1.5rem 1rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    
    .sidebar-nav {
      padding: 1rem 0;
    }
    
    .sidebar-nav a {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem 1.5rem;
      color: var(--text-primary);
      text-decoration: none;
      transition: all 0.2s ease;
      font-weight: 500;
    }
    
    .sidebar-nav a:hover {
      background: rgba(236, 72, 153, 0.1);
      color: var(--primary);
    }
    
    .sidebar-nav a.active {
      background: rgba(236, 72, 153, 0.1);
      color: var(--primary);
      border-right: 3px solid var(--primary);
    }

    /* Overlay */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 999;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }
    
    .overlay.active {
      opacity: 1;
      visibility: visible;
    }

    @media (min-width: 768px) {
      .mobile-nav {
        display: none;
      }
    }
    
    /* Main Content Styles */
    body {
      background: linear-gradient(135deg, #FFC1E3 0%, #A3D8F4 100%);
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }
    
    .container {
      padding-top: 80px;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-bottom: 2rem;
    }
    
    @media (max-width: 767px) {
      body {
        padding-top: 70px;
      }
      
      .container {
        padding: 1rem;
        padding-top: 80px;
      }
    }

  <script>
    // Mobile menu functionality
    document.addEventListener('DOMContentLoaded', function() {
      const menuBtn = document.getElementById('menuBtn');
      const sidebarMenu = document.getElementById('sidebarMenu');
      const overlay = document.getElementById('overlay');

      function openMenu() {
        sidebarMenu.classList.add('active');
        overlay.classList.add('active');
        document.body.style.overflow = 'hidden';
      }

      function closeMenu() {
        sidebarMenu.classList.remove('active');
        overlay.classList.remove('active');
        document.body.style.overflow = '';
      }

      if (menuBtn) {
        menuBtn.addEventListener('click', openMenu);
      }

      if (overlay) {
        overlay.addEventListener('click', closeMenu);
      }

      // Close menu on escape
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
          closeMenu();
        }
      });

      // Load factura detail
      loadFacturaDetail();
    });

    // Toast notification system
    function showToast(message, type = 'info') {
      const toastContainer = document.querySelector('.toast-container') || createToastContainer();
      
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      
      toast.innerHTML = `
        <div class="d-flex align-items-center gap-2">
          <i class="bi bi-${getToastIcon(type)}"></i>
          <span>${message}</span>
        </div>
      `;
      
      toastContainer.appendChild(toast);
      
      // Show toast
      setTimeout(() => toast.classList.add('show'), 100);
      
      // Remove toast
      setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    function createToastContainer() {
      const container = document.createElement('div');
      container.className = 'toast-container';
      document.body.appendChild(container);
      return container;
    }

    function getToastIcon(type) {
      switch (type) {
        case 'success': return 'check-circle';
        case 'error': return 'x-circle';
        case 'warning': return 'exclamation-triangle';
        default: return 'info-circle';
      }
    }

    // Load factura detail function
    function loadFacturaDetail() {
      const urlParams = new URLSearchParams(window.location.search);
      const facturaId = urlParams.get('id');
      
      if (!facturaId) {
        showToast('ID de factura no encontrado', 'error');
        setTimeout(() => window.location.href = 'Comprobantes.html', 2000);
        return;
      }

      showSkeletonLoading();
      
      const token = localStorage.getItem('access_token');
      
      fetch(API_URLS.cooperativa.facturasById(facturaId), {
        method: 'GET',
        headers: {
          'Authorization': `Bearer ${token}`,
          'Accept': 'application/json'
        }
      })
      .then(response => {
        if (!response.ok) {
          throw new Error(`Error ${response.status}: No se pudo cargar la factura`);
        }
        return response.json();
      })
      .then(data => {
        console.log('Factura data received:', data);
        hideSkeletonLoading();
        renderFacturaDetail(data.factura);
        setupDownloadButton(facturaId);
      })
      .catch(error => {
        console.error('Error:', error);
        hideSkeletonLoading();
        showToast('Error al cargar los detalles de la factura', 'error');
      });
    }

    function showSkeletonLoading() {
      const detailContainer = document.getElementById('factura-detalle');
      const imageContainer = document.getElementById('factura-imagen');
      
      detailContainer.innerHTML = `
        <div class="skeleton-item"></div>
        <div class="skeleton-item"></div>
        <div class="skeleton-item"></div>
        <div class="skeleton-item"></div>
        <div class="skeleton-item"></div>
      `;
      
      imageContainer.innerHTML = `
        <div class="skeleton-item" style="width: 200px; height: 200px; border-radius: 12px;"></div>
      `;
    }

    function hideSkeletonLoading() {
      // Content will be replaced by renderFacturaDetail
    }

    function renderFacturaDetail(factura) {
      const detailContainer = document.getElementById('factura-detalle');
      const imageContainer = document.getElementById('factura-imagen');
      
      // Render details
      const details = [
        { label: 'Motivo', value: factura.motivo || 'Sin motivo especificado' },
        { label: 'Fecha de Pago', value: new Date(factura.created_at).toLocaleDateString('es-ES') },
        { label: 'Monto', value: `$${parseFloat(factura.Monto || 0).toFixed(2)}` },
        { label: 'Estado', value: getEstadoBadge(factura.Estado_Pago) },
        { label: 'Mes del Pago', value: getMonthName(new Date(factura.created_at)) }
      ];
      
      detailContainer.innerHTML = details.map(item => `
        <div class="detail-item">
          <span class="detail-label">${item.label}</span>
          <span class="detail-value">${item.value}</span>
        </div>
      `).join('');
      
      // Render image
      console.log('Factura data:', factura);
      console.log('imagen_comprobante:', factura.imagen_comprobante);
      console.log('Archivo_Comprobante:', factura.Archivo_Comprobante);
      
      if (factura.imagen_comprobante) {
        // Si hay URL de imagen directa, usarla
        imageContainer.innerHTML = `
          <img src="${factura.imagen_comprobante}" alt="Comprobante" style="max-width: 100%; max-height: 400px; border-radius: 8px; box-shadow: var(--shadow);" onerror="handleImageError(this, ${factura.id})">
        `;
      } else if (factura.Archivo_Comprobante) {
        // Si hay archivo almacenado, cargar con autenticación
        console.log('Loading comprobante from API for ID:', factura.id);
        loadComprobanteImage(factura.id, imageContainer);
      } else {
        // No hay comprobante disponible
        imageContainer.innerHTML = `
          <div class="image-placeholder">
            <i class="bi bi-image"></i>
            <span>Sin imagen de comprobante</span>
          </div>
        `;
      }
    }

    // Global function to handle image errors
    window.handleImageError = function(img, facturaId) {
      console.log('Image load error, trying API endpoint for ID:', facturaId);
      const container = img.parentElement;
      loadComprobanteImage(facturaId, container);
    }

    function loadComprobanteImage(facturaId, container) {
      // Show loading state
      container.innerHTML = `
        <div class="image-placeholder">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Cargando...</span>
          </div>
          <span>Cargando comprobante...</span>
        </div>
      `;
      
      const token = localStorage.getItem('access_token');
      const comprobanteUrl = API_URLS.cooperativa.comprobante(facturaId);
      
      console.log('Fetching comprobante from:', comprobanteUrl);
      console.log('Using token:', token ? 'Present' : 'Missing');
      
      fetch(comprobanteUrl, {
        method: 'GET',
        headers: {
          'Authorization': `Bearer ${token}`,
          'Accept': '*/*'
        }
      })
      .then(response => {
        console.log('Response status:', response.status);
        console.log('Response headers:', [...response.headers.entries()]);
        
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: No se pudo cargar el comprobante`);
        }
        
        const contentType = response.headers.get('content-type');
        console.log('Content-Type:', contentType);
        
        return response.blob();
      })
      .then(blob => {
        console.log('Blob received:', blob.size, 'bytes, type:', blob.type);
        
        const imageUrl = URL.createObjectURL(blob);
        const contentType = blob.type || 'application/octet-stream';
        
        if (contentType.startsWith('image/')) {
          container.innerHTML = `
            <img src="${imageUrl}" alt="Comprobante" 
                 style="max-width: 100%; max-height: 400px; border-radius: 8px; box-shadow: var(--shadow);">
          `;
        } else if (contentType.includes('pdf')) {
          container.innerHTML = `
            <div class="image-placeholder">
              <i class="bi bi-file-earmark-pdf" style="font-size: 4rem; color: #dc3545;"></i>
              <span>Documento PDF</span>
              <button type="button" class="btn btn-primary mt-2" onclick="window.open('${imageUrl}', '_blank')" style="justify-content: center;">
                Ver PDF
              </button>
            </div>
          `;
        } else {
          // Try to display as image anyway (some servers don't set correct content-type)
          const img = new Image();
          img.onload = function() {
            container.innerHTML = `
              <img src="${imageUrl}" alt="Comprobante" 
                   style="max-width: 100%; max-height: 400px; border-radius: 8px; box-shadow: var(--shadow);">
            `;
          };
          img.onerror = function() {
            container.innerHTML = `
              <div class="image-placeholder">
                <i class="bi bi-file-earmark" style="font-size: 4rem; color: #6c757d;"></i>
                <span>Archivo de comprobante</span>
                <button type="button" class="btn btn-secondary mt-2" onclick="window.open('${imageUrl}', '_blank')">
                  <i class="bi bi-eye me-1"></i>Ver Archivo
                </button>
              </div>
            `;
          };
          img.src = imageUrl;
        }
      })
      .catch(error => {
        console.error('Error loading comprobante:', error);
        container.innerHTML = `
          <div class="image-placeholder">
            <i class="bi bi-exclamation-triangle" style="color: #f59e0b;"></i>
            <span>Error al cargar comprobante</span>
            <small>${error.message}</small>
          </div>
        `;
      });
    }

    function getMonthName(date) {
      const months = [
        'Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio',
        'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'
      ];
      return `${months[date.getMonth()]} ${date.getFullYear()}`;
    }

    function getEstadoBadge(estado) {
      const badges = {
        'Pendiente': '<span style="background: #f59e0b; color: white; padding: 0.25rem 0.75rem; border-radius: 20px; font-size: 0.8rem;">Pendiente</span>',
        'Aprobado': '<span style="background: #10b981; color: white; padding: 0.25rem 0.75rem; border-radius: 20px; font-size: 0.8rem;">Aprobado</span>',
        'Rechazado': '<span style="background: #ef4444; color: white; padding: 0.25rem 0.75rem; border-radius: 20px; font-size: 0.8rem;">Rechazado</span>'
      };
      
      return badges[estado] || estado;
    }

    function setupDownloadButton(facturaId) {
      const downloadBtn = document.getElementById('downloadBtn');
      const downloadBtnMobile = document.getElementById('downloadBtnMobile');
      
      function downloadComprobante() {
        showToast('Iniciando descarga...', 'info');
        
        const token = localStorage.getItem('access_token');
        
        fetch(API_URLS.cooperativa.comprobante(facturaId) + '?download=true', {
          method: 'GET',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Accept': '*/*'
          }
        })
        .then(response => {
          if (!response.ok) {
            throw new Error(`Error ${response.status}: No se pudo descargar el comprobante`);
          }
          
          const contentDisposition = response.headers.get('content-disposition');
          let filename = `comprobante_${facturaId}`;
          
          if (contentDisposition) {
            const filenameMatch = contentDisposition.match(/filename[^;=\\n]*=((['"]).*?\\2|[^;\\n]*)/);
            if (filenameMatch) {
              filename = filenameMatch[1].replace(/['"]/g, '');
            }
          }
          
          if (!filename.includes('.')) {
            const contentType = response.headers.get('content-type');
            if (contentType) {
              if (contentType.includes('pdf')) {
                filename += '.pdf';
              } else if (contentType.includes('image')) {
                if (contentType.includes('jpeg') || contentType.includes('jpg')) {
                  filename += '.jpg';
                } else if (contentType.includes('png')) {
                  filename += '.png';
                } else {
                  filename += '.jpg';
                }
              }
            }
          }
          
          return response.blob().then(blob => ({ blob, filename }));
        })
        .then(({ blob, filename }) => {
          const url = window.URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.style.display = 'none';
          a.href = url;
          a.download = filename;
          
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          
          window.URL.revokeObjectURL(url);
          showToast('Comprobante descargado correctamente', 'success');
        })
        .catch(error => {
          console.error('Error al descargar comprobante:', error);
          showToast('Error al descargar el comprobante', 'error');
        });
      }
      
      if (downloadBtn) {
        downloadBtn.addEventListener('click', downloadComprobante);
      }
      
      if (downloadBtnMobile) {
        downloadBtnMobile.addEventListener('click', downloadComprobante);
      }
    }

    function openImageModal(imageSrc) {
      // Create modal for full-size image viewing
      const modal = document.createElement('div');
      modal.style.cssText = `
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.9);
        z-index: 10000;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      `;
      
      const img = document.createElement('img');
      img.src = imageSrc;
      img.style.cssText = `
        max-width: 90%;
        max-height: 90%;
        border-radius: 8px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      `;
      
      modal.appendChild(img);
      document.body.appendChild(modal);
      
      modal.addEventListener('click', () => {
        document.body.removeChild(modal);
      });
    }
  </script>
</body>
