<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Asambleas - Cooperativa</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="styles_tabla.css">
  
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
  
  <!-- Google Fonts - Poppins -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    /* Global Box Sizing */
    *, *::before, *::after {
      box-sizing: border-box;
    }
    
    html, body {
      overflow-x: hidden;
      width: 100%;
      font-family: 'Poppins', sans-serif;
    }
    
    /* Mobile Responsive adjustments */
    @media (max-width: 767px) {
      .asambleas-container {
        padding: 0.5rem;
      }
      
      .asambleas-box {
        margin: 0.5rem 0;
        border-radius: 12px;
      }
      
      .modern-header {
        flex-direction: column;
        gap: 1rem;
        align-items: stretch;
      }
      
      .filter-tabs {
        justify-content: center;
        flex-wrap: wrap;
      }
      
      .asambleas-grid {
        grid-template-columns: 1fr;
        gap: 1rem;
      }
    }

    /* ============================================
       CSS CUSTOM PROPERTIES - MODERN COLOR SYSTEM
    ============================================ */
    :root {
      --primary: #ec4899;
      --secondary: #c084fc;
      --success: #10b981;
      --warning: #f59e0b;
      --error: #ef4444;
      --info: #3b82f6;
      --surface: #ffffff;
      --surface-variant: #f8fafc;
      --text-primary: #1f2937;
      --text-secondary: #6b7280;
      --text-tertiary: #9ca3af;
      --text-disabled: #d1d5db;
      --border: #e5e7eb;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
    }

    /* ============================================
       ASAMBLEAS SPECIFIC STYLES
    ============================================ */
    .asambleas-container {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 20px 0 48px 0;
    }

    .asambleas-box {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 24px 32px 24px 32px;
      min-width: 350px;
      max-width: 1400px;
      width: 100%;
    }

    /* Modern Header */
    .modern-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
      gap: 1rem;
    }
    
    .header-title h2 {
      font-size: 1.875rem;
      font-weight: 700;
      color: var(--text-primary);
      margin: 0;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    
    .header-title h2 i {
      color: var(--primary);
    }
    
    .header-subtitle {
      color: var(--text-secondary);
      margin: 0.5rem 0 0 0;
      font-size: 1rem;
    }

    .filter-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    .filter-tab {
      padding: 12px 24px;
      border: 2px solid var(--border);
      background: var(--surface);
      border-radius: 25px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-weight: 500;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .filter-tab.active {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
    }

    .filter-tab:hover {
      border-color: var(--primary);
      transform: translateY(-2px);
    }

    .asambleas-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 20px;
      min-height: 200px;
    }

    .asamblea-card {
      background: var(--surface);
      border-radius: 16px;
      padding: 0;
      box-shadow: var(--shadow-md);
      transition: all 0.3s ease;
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .asamblea-card:hover {
      transform: translateY(-5px);
      box-shadow: var(--shadow-xl);
    }

    .asamblea-header {
      padding: 1.5rem 1.5rem 1rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .asamblea-icon {
      width: 50px;
      height: 50px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 1.5rem;
      flex-shrink: 0;
    }

    .fecha-badge {
      background: var(--primary);
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 0.375rem;
      white-space: nowrap;
    }

    .fecha-badge.futura {
      background: var(--success);
    }

    .fecha-badge.pasada {
      background: var(--text-tertiary);
    }

    .asamblea-body {
      padding: 0 1.5rem 1rem 1.5rem;
    }

    .lugar-title {
      font-size: 1.3rem;
      font-weight: 600;
      color: var(--text-primary);
      margin: 0 0 10px 0;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .fecha-info {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .detalle-text {
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 15px;
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
    }

    .asamblea-footer {
      padding: 1rem 1.5rem;
      border-top: 1px solid var(--border);
      background: var(--surface-variant);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .loading-spinner {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 200px;
      font-size: 1.1rem;
      color: var(--text-secondary);
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-secondary);
    }

    .empty-state i {
      font-size: 4rem;
      margin-bottom: 20px;
      color: var(--text-tertiary);
    }

    .btn-resolucion {
      background: linear-gradient(135deg, var(--info), var(--primary));
      border: none;
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 500;
      transition: all 0.3s ease;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn-resolucion:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
      color: white;
    }

    /* Global Styles */
    #navbar {
      position: sticky;
      top: 0;
      z-index: 100;
    }

    body {
      background: linear-gradient(135deg, #FFC1E3 0%, #A3D8F4 100%);
      overflow-x: hidden;
    }

    /* Responsive Design */
    @media (max-width: 480px) {
      .sidebar-menu {
        width: 260px;
      }
      
      .asambleas-box {
        padding: 16px;
        min-width: unset;
        max-width: 100vw;
      }
      
      .header-title h2 {
        font-size: 1.5rem;
      }
      
      .asamblea-header {
        padding: 1rem;
      }
      
      .asamblea-body {
        padding: 0 1rem 1rem 1rem;
      }
      
      .asamblea-footer {
        padding: 0.75rem 1rem;
      }
    }
  </style>
</head>

<body>
  <!-- Mobile Navbar Container -->
  <div id="mobile-navbar-container"></div>
  
  <!-- Desktop Navbar Container -->
  <div id="navbar"></div>

  <div class="asambleas-container">
    <div class="asambleas-box">
      <!-- Modern Header -->
      <div class="modern-header">
        <div class="header-title">
          <h2><i class="bi bi-people-fill"></i>Asambleas</h2>
          <p class="header-subtitle">Consulta las asambleas programadas y pasadas de la cooperativa</p>
        </div>
      </div>



    <!-- Filter Tabs -->
    <div class="filter-tabs">
      <div class="filter-tab active" data-filter="todas">
        <i class="bi bi-list-ul me-2"></i>Todas las Asambleas
      </div>
      <div class="filter-tab" data-filter="futuras">
        <i class="bi bi-calendar-plus me-2"></i>Próximas
      </div>
      <div class="filter-tab" data-filter="pasadas">
        <i class="bi bi-calendar-check me-2"></i>Realizadas
      </div>
    </div>

    <!-- Loading State -->
    <div id="loading" class="loading-spinner">
      <div class="spinner-border text-primary me-3" role="status"></div>
      Cargando asambleas...
    </div>

    <!-- Asambleas Grid -->
    <div id="asambleas-grid" class="asambleas-grid" style="display: none;"></div>

    <!-- Empty State -->
    <div id="empty-state" class="empty-state" style="display: none;">
      <i class="bi bi-calendar-x"></i>
      <h3>No hay asambleas</h3>
      <p>No se encontraron asambleas que mostrar en este momento.</p>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="JavaScript/config.js"></script>
  <script src="JavaScript/loader.js"></script>
  <script src="JavaScript/navbar-loader.js"></script>
  <script src="JavaScript/asambleas.js"></script>

  <script>
    // Initialize page
    document.addEventListener('DOMContentLoaded', function() {
      // Los navbars se cargan automáticamente por navbar-loader.js
      
      // Initialize asambleas functionality
      if (typeof initAsambleas === 'function') {
        initAsambleas();
      }
    });
  </script>
</body>

</html>
