      const savedTheme = localStorage.getItem('theme') || 'light';
      const themes = {

          '--mobile-nav-shadow': '0 2px 20px rgba(0, 0, 0, 0.3)',
          '--mobile-nav-border': 'rgba(63, 63, 70, 0.3)'
        }, 
        light: {
          '--primary': '#d946a6',
          '--primary-rgb': '217, 70, 166',
          '--primary-light': '#f3e8f8',

          '--sidebar-header-bg': 'linear-gradient(135deg, #e9d5ff 0%, #ddd6fe 100%)',
          '--sidebar-hover': 'rgba(217, 70, 166, 0.08)',
          '--sidebar-text': '#334155',
          '--sidebar-divider': '#e2e8f0',
          '--mobile-nav-bg': 'rgba(255, 255, 255, 0.95)',
          '--mobile-nav-shadow': '0 2px 20px rgba(249, 168, 212, 0.2)',
          '--mobile-nav-border': 'rgba(249, 168, 212, 0.1)'
        }

      };
      const theme = themes[savedTheme];
      if (theme) {
        Object.entries(theme).forEach(([key, value]) => {
          document.documentElement.style.setProperty(key, value);
        });
      }
    })();
  </script>
