<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planes de Trabajo del Usuario</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="styles_tabla.css">
</head>
<body>
  <!-- Mobile Navbar Container -->
  <div id="mobile-navbar-container"></div>

  <!-- Desktop Navbar (existing) -->
  <div id="navbar"></div>
  
  <!-- Main Content Container -->
  <div class="main-container">
    <div class="content-wrapper">
      
      <!-- Page Header -->
      <div class="page-header">
        <div class="header-content">
          <div class="page-title">
            <i class="bi bi-calendar-check page-icon"></i>
            <div class="title-text">
              <h1>Planes de Trabajo</h1>
              <p>Gestiona y supervisa tus planes de trabajo asignados</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Plans Content -->
      <div class="plans-content">
        
        <!-- Stats Overview -->
        <div class="stats-overview" id="statsOverview">
          <!-- Skeleton Stats -->
          <div class="stat-card skeleton" id="stat-total-skeleton">
            <div class="stat-icon skeleton-shimmer"></div>
            <div class="stat-content">
              <div class="skeleton-line" style="width: 60px; height: 24px;"></div>
              <div class="skeleton-line" style="width: 120px; height: 16px; margin-top: 8px;"></div>
            </div>
          </div>
          
          <div class="stat-card skeleton" id="stat-active-skeleton">
            <div class="stat-icon skeleton-shimmer"></div>
            <div class="stat-content">
              <div class="skeleton-line" style="width: 60px; height: 24px;"></div>
              <div class="skeleton-line" style="width: 120px; height: 16px; margin-top: 8px;"></div>
            </div>
          </div>
          
          <div class="stat-card skeleton" id="stat-completed-skeleton">
            <div class="stat-icon skeleton-shimmer"></div>
            <div class="stat-content">
              <div class="skeleton-line" style="width: 60px; height: 24px;"></div>
              <div class="skeleton-line" style="width: 120px; height: 16px; margin-top: 8px;"></div>
            </div>
          </div>

          <!-- Real Stats (hidden initially) -->
          <div class="stat-card" id="stat-total" style="display: none;">
            <div class="stat-icon total">
              <i class="bi bi-calendar2-week"></i>
            </div>
            <div class="stat-content">
              <div class="stat-number" id="totalPlanes">0</div>
              <div class="stat-label">Planes Totales</div>
            </div>
          </div>

          <div class="stat-card" id="stat-active" style="display: none;">
            <div class="stat-icon active">
              <i class="bi bi-play-circle"></i>
            </div>
            <div class="stat-content">
              <div class="stat-number" id="planesActivos">0</div>
              <div class="stat-label">Planes Activos</div>
            </div>
          </div>

          <div class="stat-card" id="stat-completed" style="display: none;">
            <div class="stat-icon completed">
              <i class="bi bi-check-circle"></i>
            </div>
            <div class="stat-content">
              <div class="stat-number" id="planesCompletados">0</div>
              <div class="stat-label">Completados</div>
            </div>
          </div>
        </div>

        <!-- Plans Grid -->
        <div class="plans-grid" id="planesGrid">
          
          <!-- Skeleton Plans -->
          <div class="plan-card skeleton" id="plan-skeleton-1">
            <div class="plan-header">
              <div class="skeleton-line" style="width: 80px; height: 20px;"></div>
              <div class="skeleton-line" style="width: 60px; height: 16px; margin-top: 8px;"></div>
            </div>
            <div class="plan-body">
              <div class="skeleton-line" style="width: 100px; height: 32px; margin-bottom: 16px;"></div>
              <div class="skeleton-line" style="width: 100%; height: 8px; border-radius: 4px;"></div>
              <div class="skeleton-line" style="width: 150px; height: 14px; margin-top: 12px;"></div>
            </div>
          </div>

          <div class="plan-card skeleton" id="plan-skeleton-2">
            <div class="plan-header">
              <div class="skeleton-line" style="width: 80px; height: 20px;"></div>
              <div class="skeleton-line" style="width: 60px; height: 16px; margin-top: 8px;"></div>
            </div>
            <div class="plan-body">
              <div class="skeleton-line" style="width: 100px; height: 32px; margin-bottom: 16px;"></div>
              <div class="skeleton-line" style="width: 100%; height: 8px; border-radius: 4px;"></div>
              <div class="skeleton-line" style="width: 150px; height: 14px; margin-top: 12px;"></div>
            </div>
          </div>

          <div class="plan-card skeleton" id="plan-skeleton-3">
            <div class="plan-header">
              <div class="skeleton-line" style="width: 80px; height: 20px;"></div>
              <div class="skeleton-line" style="width: 60px; height: 16px; margin-top: 8px;"></div>
            </div>
            <div class="plan-body">
              <div class="skeleton-line" style="width: 100px; height: 32px; margin-bottom: 16px;"></div>
              <div class="skeleton-line" style="width: 100%; height: 8px; border-radius: 4px;"></div>
              <div class="skeleton-line" style="width: 150px; height: 14px; margin-top: 12px;"></div>
            </div>
          </div>

          <!-- No Data Message (hidden initially) -->
          <div class="no-data-message" id="noDataMessage" style="display: none;">
            <i class="bi bi-calendar-x"></i>
            <h3>No hay planes de trabajo</h3>
            <p>No tienes planes de trabajo asignados en este momento.</p>
          </div>
        </div>

      </div>
  <table class="hours-table facturas-table" style="width:100%;max-width:1200px;margin:0 auto;">
        <thead>
          <tr>
            <th style="padding: 1rem 2.5rem;">Mes</th>
            <th style="padding: 1rem 2.5rem;">Año</th>
            <th style="padding: 1rem 2.5rem;">Horas Requeridas</th>
            <th style="padding: 1rem 2.5rem;">Horas Completadas</th>
            <th style="padding: 1rem 2.5rem;">Progreso</th>
          </tr>
        </thead>
        <tbody id="tabla-planes-tbody">
          <!-- Skeleton loader -->
          <tr class="skeleton-row">
            <td><div class="skeleton-box" style="width:80px;height:18px;"></div></td>
            <td><div class="skeleton-box" style="width:60px;height:18px;"></div></td>
            <td><div class="skeleton-box" style="width:90px;height:18px;"></div></td>
            <td><div class="skeleton-box" style="width:90px;height:18px;"></div></td>
            <td><div class="skeleton-box" style="width:100px;height:18px;"></div></td>
          </tr>
          <tr class="skeleton-row">
            <td><div class="skeleton-box" style="width:80px;height:18px;"></div></td>
            <td><div class="skeleton-box" style="width:60px;height:18px;"></div></td>
            <td><div class="skeleton-box" style="width:90px;height:18px;"></div></td>
            <td><div class="skeleton-box" style="width:90px;height:18px;"></div></td>
            <td><div class="skeleton-box" style="width:100px;height:18px;"></div></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="JavaScript/dashboard.js"></script>
  <script src="JavaScript/loader.js"></script>
  <script src="JavaScript/config.js"></script>
  <script src="JavaScript/planes_trabajo_usuario.js"></script>
  <script src="JavaScript/navbar-loader.js"></script>
  
  <style>
    .skeleton-box {
      background: linear-gradient(90deg, #e0e0e0 25%, #f5f5f5 50%, #e0e0e0 75%);
      border-radius: 6px;
      animation: skeleton-loading 1.2s infinite linear;
      display: inline-block;
    }
    @keyframes skeleton-loading {
      0% { background-position: -200px 0; }
      100% { background-position: calc(200px + 100%) 0; }
    }
    .facturas-container {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 48px 0 48px 0;
    }
    .facturas-box {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 32px 32px 24px 32px;
      min-width: 350px;
      max-width: 1200px;
      width: 100%;
    }
    .facturas-header {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 24px;
    }
    .facturas-header h2 {
      margin: 0 auto;
      font-size: 2rem;
      color: #d81b60;
      font-weight: 700;
      letter-spacing: 1px;
      text-align: center;
      width: 100%;
    }
    .facturas-table thead {
      background: #C8EAF1 ;
    }
    .facturas-table thead th {
      color: #154360;
      font-weight: 700;
      font-size: 1.1rem;
      border-bottom: 2px solid #C8EAF1;
      border-radius: 0 !important;
    }
    .facturas-table tbody tr {
      transition: background 0.2s;
      border-radius: 0 !important;
    }
    .facturas-table tbody tr:hover {
      background: #C8EAF1;
    }
    .facturas-table td {
      border-radius: 0 !important;
    }
    .hours-table th, .hours-table td {
      text-align: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .horas-desglose {
      font-size: 0.9rem;
      color: #666;
      font-weight: normal;
    }
    .horas-completo {
      background: #eafaf1 !important;
      border-left: 4px solid #27ae60;
    }
    .horas-completo:hover {
      background: #d5f4e6 !important;
    }
    @media (max-width: 600px) {
      .facturas-box {
        padding: 16px 4px 12px 4px;
        min-width: unset;
        max-width: 100vw;
      }
      .facturas-header h2 {
        font-size: 1.3rem;
      }
    }
  </style>
</body>
</html>
