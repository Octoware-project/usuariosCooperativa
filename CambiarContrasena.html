<!DOCTYPE html>
<html lang="es">
<head>
  <script>
    (function() {
      const savedTheme = localStorage.getItem('theme') || 'dark';
      const themes = {
        light: {
          '--primary': '#d946a6',
          '--primary-rgb': '217, 70, 166',
          '--primary-light': '#f3e8f8',
          '--primary-dark': '#b8388a',
          '--surface': '#ffffff',
          '--surface-variant': '#f8f9fa',
          '--surface-hover': '#f0f0f0',
          '--bg-gradient': '#ffffff',
          '--text-primary': '#1f2937',
          '--text-secondary': '#6b7280',
          '--text-muted': '#9ca3af',
          '--border': '#e5e7eb',
          '--shadow-sm': '0 1px 2px rgba(0, 0, 0, 0.05)',
          '--shadow-md': '0 4px 6px rgba(0, 0, 0, 0.1)',
          '--shadow-lg': '0 10px 15px rgba(0, 0, 0, 0.1)',
          '--shadow-xl': '0 20px 40px rgba(255, 193, 227, 0.3)',
          '--success': '#10b981',
          '--warning': '#f59e0b',
          '--error': '#ef4444',
          '--info': '#3b82f6',
          '--btn-primary-bg': '#d946a6',
          '--btn-primary-hover': '#b8388a',
          '--navbar-bg': 'rgba(255, 255, 255, 0.98)',
          '--navbar-shadow': '0 2px 10px rgba(0, 0, 0, 0.05)',
          '--navbar-border': 'rgba(226, 232, 240, 0.5)',
          '--sidebar-bg': '#ffffff',
          '--sidebar-header-bg': 'linear-gradient(135deg, #f9a8d4 0%, #ec4899 100%)',
          '--sidebar-hover': 'rgba(217, 70, 166, 0.08)',
          '--sidebar-text': '#334155',
          '--sidebar-divider': '#e2e8f0',
          '--header-bg': 'linear-gradient(135deg, #f9a8d4 0%, #c084fc 100%)',
          '--content-bg': '#fafafa'
        },
        dark: {
          '--primary': '#ec4899',
          '--primary-rgb': '236, 72, 153',
          '--primary-light': '#f472b6',
          '--primary-dark': '#db2777',
          '--surface': '#1e2128',
          '--surface-variant': '#282c34',
          '--surface-hover': '#2d3139',
          '--bg-gradient': '#16181d',
          '--text-primary': '#e4e4e7',
          '--text-secondary': '#d1d5db',
          '--text-muted': '#9ca3af',
          '--border': '#3f3f46',
          '--shadow-sm': '0 1px 2px rgba(0, 0, 0, 0.3)',
          '--shadow-md': '0 4px 6px rgba(0, 0, 0, 0.4)',
          '--shadow-lg': '0 10px 15px rgba(0, 0, 0, 0.5)',
          '--shadow-xl': '0 20px 40px rgba(0, 0, 0, 0.6)',
          '--success': '#10b981',
          '--warning': '#f59e0b',
          '--error': '#ef4444',
          '--info': '#ec4899',
          '--btn-primary-bg': '#ec4899',
          '--btn-primary-hover': '#f472b6',
          '--navbar-bg': 'rgba(30, 33, 40, 0.98)',
          '--navbar-shadow': '0 2px 10px rgba(0, 0, 0, 0.3)',
          '--navbar-border': 'rgba(63, 63, 70, 0.5)',
          '--sidebar-bg': '#1e2128',
          '--sidebar-header-bg': 'linear-gradient(135deg, #ec4899 0%, #f472b6 100%)',
          '--sidebar-hover': 'rgba(236, 72, 153, 0.15)',
          '--sidebar-text': '#e4e4e7',
          '--sidebar-divider': '#3f3f46',
          '--header-bg': 'linear-gradient(135deg, #ec4899 0%, #db2777 100%)',
          '--content-bg': '#282c34'
        }
      };
      const theme = themes[savedTheme];
      if (theme) {
        Object.entries(theme).forEach(([key, value]) => {
          document.documentElement.style.setProperty(key, value);
        });
      }
    })();
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cambiar Contraseña - Cooperativa</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <script src="JavaScript/theme.js"></script>
  
  <script src="JavaScript/i18n.js"></script>
  
  <link rel="stylesheet" href="Styles/CambiarContraseña.css">
  
  <link rel="icon" type="image/jpeg" href="img/Logo.jpg">

</head>
<body>

  <div id="navbar"></div>
  
  
  <div class="container-custom">
    <div class="password-card">
      <div class="password-header">
        <div class="password-icon">
          <i class="bi bi-shield-lock-fill"></i>
        </div>
        <div class="password-header-text">
          <h1 data-i18n="profile.changePassword">Cambiar Contraseña</h1>
          <p data-i18n="profile.updatePasswordSecure">Actualiza tu contraseña para mantener tu cuenta segura</p>
        </div>
      </div>

      <form id="passwordForm">
        <input type="email" id="username" name="username" autocomplete="username" style="display: none;" aria-hidden="true" tabindex="-1">

        <div class="form-group">
          <label for="current_password" class="form-label" data-i18n="profile.currentPassword">Contraseña Actual</label>
          <input type="password" class="form-control" id="current_password" name="current_password" 
                 autocomplete="current-password" required>
        </div>

        <div class="form-group">
          <label for="password" class="form-label" data-i18n="profile.newPassword">Nueva Contraseña</label>
          <input type="password" class="form-control" id="password" name="password" 
                 autocomplete="new-password" required>
        </div>

        <div class="form-group">
          <label for="password_confirmation" class="form-label" data-i18n="profile.confirmPassword">Confirmar Nueva Contraseña</label>
          <input type="password" class="form-control" id="password_confirmation" name="password_confirmation" 
                 autocomplete="new-password" required>
        </div>

        <div class="password-requirements">
          <h3 data-i18n="profile.passwordRequirements">Recomendaciones para la contraseña:</h3>
          <ul class="requirement-list">
            <li class="requirement-item">
              <i class="bi bi-circle-fill"></i>
              <span data-i18n="profile.minCharacters">Mínimo 8 caracteres</span>
            </li>
            <li class="requirement-item">
              <i class="bi bi-circle-fill"></i>
              <span data-i18n="profile.uppercase">Al menos una letra mayúscula</span>
            </li>
            <li class="requirement-item">
              <i class="bi bi-circle-fill"></i>
              <span data-i18n="profile.lowercase">Al menos una letra minúscula</span>
            </li>
            <li class="requirement-item">
              <i class="bi bi-circle-fill"></i>
              <span data-i18n="profile.number">Al menos un número</span>
            </li>
          </ul>
        </div>

        <div class="btn-group-actions">
          <button type="button" class="btn-cancel" id="cancelBtn" data-i18n="profile.cancel">
            Cancelar
          </button>
          <button type="submit" class="btn-save">
            <i class="bi bi-check-circle-fill"></i>
            <span data-i18n="profile.saveChanges">Guardar Cambios</span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="JavaScript/config.js"></script>
  <script src="JavaScript/navbar-functions.js"></script>
  <script src="JavaScript/mobile-navbar.js"></script>
  <script src="JavaScript/dashboard.js"></script>
  <script src="JavaScript/loader.js"></script>
  <script src="JavaScript/CambiarContraseña.js"></script>
 
</body>
</html>
