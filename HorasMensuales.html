<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Horas Mensuales</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="styles_tabla.css">
  
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
  
  <!-- Google Fonts - Poppins -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    /* Mobile Navigation Styles */
    .mobile-nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      padding: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
      box-shadow: 0 2px 20px rgba(249, 168, 212, 0.2);
      border-bottom: 1px solid rgba(249, 168, 212, 0.1);
    }
    
    .menu-btn {
      background: none;
      border: none;
      font-size: 1.5rem;
      color: #ec4899;
      cursor: pointer;
      padding: 0.5rem;
      border-radius: 8px;
      transition: all 0.2s ease;
    }
    
    .menu-btn:hover {
      background: rgba(236, 72, 153, 0.1);
      transform: scale(1.05);
    }
    
    .user-icon-mobile {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f9a8d4 0%, #ec4899 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 700;
      font-size: 1.2rem;
      box-shadow: 0 4px 12px rgba(249, 168, 212, 0.4);
      transition: all 0.2s ease;
      cursor: pointer;
    }
    
    .user-icon-mobile:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 16px rgba(236, 72, 153, 0.5);
    }
    
    /* Sidebar Menu */
    .sidebar-menu {
      position: fixed;
      top: 0;
      left: -300px;
      width: 280px;
      height: 100vh;
      background: white;
      box-shadow: 4px 0 20px rgba(0, 0, 0, 0.15);
      z-index: 1001;
      transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      overflow-y: auto;
    }
    
    .sidebar-menu.open {
      left: 0;
    }
    
    .sidebar-header {
      background: linear-gradient(135deg, #f9a8d4 0%, #c084fc 100%);
      padding: 2rem 1.5rem;
      color: white;
      text-align: center;
    }
    
    .sidebar-header h3 {
      margin: 0;
      font-size: 1.3rem;
      font-weight: 600;
    }
    
    .sidebar-header p {
      margin: 0.5rem 0 0 0;
      opacity: 0.9;
      font-size: 0.9rem;
    }
    
    .sidebar-nav {
      padding: 1rem 0;
      display: flex;
      flex-direction: column;
    }
    
    .sidebar-nav a {
      display: flex;
      align-items: center;
      padding: 1rem 1.5rem;
      color: #334155;
      text-decoration: none;
      font-weight: 500;
      transition: all 0.2s ease;
      border-bottom: 1px solid #f1f5f9;
      width: 100%;
      box-sizing: border-box;
    }
    
    .sidebar-nav a:last-child {
      border-bottom: none;
    }
    
    .sidebar-nav a:hover {
      background: #ffc1e3;
      color: #ec4899;
      transform: translateX(5px);
    }
    
    .sidebar-nav a i {
      width: 20px;
      margin-right: 1rem;
      font-size: 1.1rem;
    }
    
    .sidebar-nav .divider {
      height: 1px;
      background: #e2e8f0;
      margin: 0.5rem 1.5rem;
      flex-shrink: 0;
    }
    
    /* Overlay */
    .menu-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 999;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }
    
    .menu-overlay.active {
      opacity: 1;
      visibility: visible;
    }
    
    /* User dropdown mobile */
    .user-dropdown-mobile {
      position: absolute;
      top: 60px;
      right: 1rem;
      background: white;
      border-radius: 12px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
      min-width: 180px;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-10px);
      transition: all 0.3s ease;
      z-index: 1002;
    }
    
    .user-dropdown-mobile.show {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }
    
    .user-dropdown-mobile a {
      display: flex;
      align-items: center;
      padding: 0.75rem 1rem;
      color: #334155;
      text-decoration: none;
      font-weight: 500;
      transition: all 0.2s ease;
      border-bottom: 1px solid #f1f5f9;
    }
    
    .user-dropdown-mobile a:last-child {
      border-bottom: none;
      border-radius: 0 0 12px 12px;
    }
    
    .user-dropdown-mobile a:first-child {
      border-radius: 12px 12px 0 0;
    }
    
    .user-dropdown-mobile a:hover {
      background: #ffc1e3;
      color: #ec4899;
    }
    
    .user-dropdown-mobile a i {
      width: 16px;
      margin-right: 0.75rem;
    }
    
    /* Mobile Responsive */
    @media (min-width: 768px) {
      .mobile-nav {
        display: none;
      }
      
      .sidebar-menu,
      .menu-overlay,
      .user-dropdown-mobile {
        display: none;
      }
    }
    
    @media (max-width: 767px) {
      #navbar {
        display: none;
      }
      
      body {
        padding-top: 70px;
      }
      
      .main-container {
        padding: 0.5rem;
      }
      
      .facturas-box {
        margin: 0.5rem 0;
        border-radius: 12px;
      }
      
      .facturas-table {
        font-size: 0.85rem;
      }
      
      .facturas-table th,
      .facturas-table td {
        padding: 0.5rem 0.25rem;
      }
    }
    
    @media (max-width: 480px) {
      .sidebar-menu {
        width: 260px;
      }
      
      .facturas-table {
        font-size: 0.8rem;
      }
      
      .btn {
        padding: 0.5rem 1rem;
        font-size: 0.85rem;
      }
    }
  </style>
</head>

<body>
  <!-- Mobile Navbar Container -->
  <div id="mobile-navbar-container"></div>
  
  <!-- Desktop Navbar (existing) -->
  <div id="navbar"></div>
  <div class="main-container">
    <div class="left-panel">
      <div class="facturas-box">
        <div class="facturas-header">
          <h2>Horas Mensuales</h2>
          <a href="AgregarHoras.html" class="btn btn-agregar">Agregar</a>
        </div>
        <table class="hours-table facturas-table">
          <thead>
            <tr>
              <th>Fecha</th>
              <th>Horas</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla-horas-tbody">
            <!-- Skeleton loader -->
            <tr class="skeleton-row">
              <td><div class="skeleton-box" style="width:80px;height:18px;"></div></td>
              <td><div class="skeleton-box" style="width:50px;height:18px;"></div></td>
              <td><div class="skeleton-box" style="width:90px;height:18px;"></div></td>
            </tr>
            <tr class="skeleton-row">
              <td><div class="skeleton-box" style="width:80px;height:18px;"></div></td>
              <td><div class="skeleton-box" style="width:50px;height:18px;"></div></td>
              <td><div class="skeleton-box" style="width:90px;height:18px;"></div></td>
            </tr>
            <tr class="skeleton-row">
              <td><div class="skeleton-box" style="width:80px;height:18px;"></div></td>
              <td><div class="skeleton-box" style="width:50px;height:18px;"></div></td>
              <td><div class="skeleton-box" style="width:90px;height:18px;"></div></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
    <div class="right-panel">
      <div class="clock-icon-container">
  <img id="progreso-icono" src="img/clock_icon.svg" alt="Reloj" class="clock-icon" />
      </div>
      <div class="progress-info">
        <div class="progress-label">Progreso del mes actual</div>
        
        <!-- Skeleton loader -->
        <div class="progress-bar-bg" id="progress-bar-bg-skeleton">
          <div class="skeleton-box" style="width:100%;height:24px;"></div>
        </div>
        
        <!-- Barra de progreso simple -->
        <div class="progress-bar-container" id="progress-bar-container" style="display:none;">
          <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progress-bar" style="width:0%"></div>
          </div>
        </div>
        
        <div class="progress-values" id="progress-values">&nbsp;</div>
        <div class="progress-finished" id="progress-finished" style="display:none;color:#27ae60;font-weight:600;margin-top:10px;text-align:center;">Plan del mes Terminado</div>
        <button id="btn-ver-planes" class="btn-ver-planes" style="margin:32px auto 0 auto;display:block;width:100%;max-width:260px;padding:12px 0;font-size:1.1rem;font-weight:600;background:#1976d2;color:#fff;border:none;border-radius:8px;box-shadow:0 2px 8px rgba(25,118,210,0.08);cursor:pointer;transition:background 0.2s;">Ver Planes de Trabajo</button>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="JavaScript/dashboard.js?v=2"></script>
  <script src="JavaScript/loader.js?v=2"></script>
  <script src="JavaScript/config.js"></script>
  <script src="JavaScript/horasmensuales.js?v=2"></script>
  <script src="JavaScript/navbar-loader.js"></script>
  <script>
    // Redirigir al hacer click en el botón de planes de trabajo
    document.addEventListener('DOMContentLoaded', function() {
      initUserIcon();
      initFilters();
      initSkeletonLoader();
      
      // Cargar horas y progreso del plan de trabajo del mes vigente
      loadHoras(); // Incluye progreso específico del plan activo del mes
      
      // Redirigir al hacer click en el botón de planes de trabajo
      var btnPlanes = document.getElementById('btn-ver-planes');
      if (btnPlanes) {
        btnPlanes.addEventListener('click', function() {
          window.location.href = 'PlanesTrabajoUsuario.html';
        });
      }
    });
    // Mostrar skeleton loaders
    function mostrarSkeletons() {
      // Tabla
      const tbody = document.getElementById('tabla-horas-tbody');
      if (tbody) {
        Array.from(tbody.getElementsByClassName('skeleton-row')).forEach(row => row.style.display = '');
      }
      // Progreso
      const barSkeleton = document.getElementById('progress-bar-bg-skeleton');
      const barContainer = document.getElementById('progress-bar-container');
      if (barSkeleton) barSkeleton.style.display = '';
      if (barContainer) barContainer.style.display = 'none';
      const values = document.getElementById('progress-values');
      if (values) values.innerHTML = '&nbsp;';
    }

    // Ocultar skeleton loaders
    function ocultarSkeletons() {
      // Tabla
      const tbody = document.getElementById('tabla-horas-tbody');
      if (tbody) {
        Array.from(tbody.getElementsByClassName('skeleton-row')).forEach(row => row.style.display = 'none');
      }
      // Progreso
      const barSkeleton = document.getElementById('progress-bar-bg-skeleton');
      const barContainer = document.getElementById('progress-bar-container');
      if (barSkeleton) barSkeleton.style.display = 'none';
      if (barContainer) barContainer.style.display = '';
    }

    // ============================================
    // DYNAMIC HORAS LOADING
    // ============================================

    // Load horas from API and render as cards - USANDO ENDPOINT OPTIMIZADO + PROGRESO DEL PLAN VIGENTE
    async function loadHoras() {
      try {
        mostrarSkeletons();
        
        const token = localStorage.getItem('access_token');
        if (!token) {
          showNoHorasMessage('No hay token de autenticación');
          return;
        }

        // Cargar horas y progreso en paralelo para mejor rendimiento
        const loadPromises = [
          cargarHorasYStats(),
          cargarProgresoMesVigente()
        ];

        await Promise.allSettled(loadPromises);

      } catch (error) {
        console.error('Error loading dashboard:', error);
        ocultarSkeletons();
        showNoHorasMessage('Error al cargar el dashboard de horas');
      }
    }

    /**
     * Cargar horas y estadísticas usando el endpoint optimizado o método alternativo
     */
    async function cargarHorasYStats() {
      const token = localStorage.getItem('access_token');
      const now = new Date();
      const mes = now.getMonth() + 1;
      const anio = now.getFullYear();

      try {
        // Intentar usar el endpoint optimizado si existe
        if (API_URLS.cooperativa.dashboardHoras) {
          const dashboardUrl = API_URLS.cooperativa.dashboardHoras(mes, anio);
          console.log('Intentando endpoint optimizado:', dashboardUrl);
          
          const response = await fetch(dashboardUrl, {
            headers: {
              'Authorization': 'Bearer ' + token,
              'Content-Type': 'application/json'
            }
          });

          if (response.ok) {
            const dashboardData = await response.json();
            console.log('Dashboard data cargado:', dashboardData);

            // Hide skeleton loaders
            ocultarSkeletons();

            // Render horas as cards usando los datos optimizados
            renderHorasOptimized(dashboardData.registros);

            // Update stats usando el resumen pre-calculado
            updateStatsOptimized(dashboardData.resumen);

            return; // Salir si tuvo éxito
          }
        }

        // Método alternativo: cargar horas normalmente
        console.log('Usando método alternativo para cargar horas...');
        
        const response = await fetch(API_URLS.cooperativa.horas(), {
          headers: {
            'Authorization': 'Bearer ' + token,
            'Content-Type': 'application/json'
          }
        });

        if (!response.ok) {
          throw new Error('Error al cargar horas: ' + response.status);
        }

        const data = await response.json();
        console.log('Horas cargadas (método alternativo):', data);

        ocultarSkeletons();

        // Render usando el método compatible
        if (data && Array.isArray(data.horas)) {
          renderHoras(data.horas);
          updateStats(data.horas);
        } else {
          showNoHorasMessage('No hay horas registradas');
        }

      } catch (error) {
        console.error('Error al cargar horas y stats:', error);
        ocultarSkeletons();
        showNoHorasMessage(`Error al cargar horas: ${error.message}`);
      }
    }

    // Render horas as cards - VERSIÓN OPTIMIZADA
    function renderHorasOptimized(registros) {
      const container = document.getElementById('horasGrid');
      
      // Clear existing dynamic cards but keep skeleton
      const existingCards = container.querySelectorAll('.hora-card:not(.skeleton)');
      existingCards.forEach(card => card.remove());

      if (!registros || registros.length === 0) {
        showNoHorasMessage('No hay registros de horas para mostrar');
        return;
      }

      registros.forEach((registro, index) => {
        const card = createHoraCardOptimized(registro);
        container.appendChild(card);
        
        // Animate card entrance
        setTimeout(() => {
          card.style.opacity = '1';
          card.style.transform = 'translateY(0)';
        }, index * 100);
      });
    }

    // Render horas as cards - MANTENER COMPATIBILIDAD CON VERSIÓN ANTERIOR
    function renderHoras(horas) {
      console.warn('Usando renderHoras legacy - considera migrar a renderHorasOptimized');
      
      const container = document.getElementById('horasGrid');
      
      // Clear existing dynamic cards but keep skeleton
      const existingCards = container.querySelectorAll('.hora-card:not(.skeleton)');
      existingCards.forEach(card => card.remove());

      // Convertir formato legacy a optimizado si es necesario
      let registros = [];
      if (horas && horas.horas && Array.isArray(horas.horas)) {
        registros = horas.horas;
      } else if (Array.isArray(horas)) {
        registros = horas;
      }

      if (registros.length === 0) {
        showNoHorasMessage('No hay registros de horas para mostrar');
        return;
      }

      registros.forEach((hora, index) => {
        const card = createHoraCard(hora);
        container.appendChild(card);
        
        // Animate card entrance
        setTimeout(() => {
          card.style.opacity = '1';
          card.style.transform = 'translateY(0)';
        }, index * 100);
      });
    }

    // Create a single hora card - VERSIÓN OPTIMIZADA
    function createHoraCardOptimized(registro) {
      const card = document.createElement('div');
      card.className = 'hora-card';
      card.style.opacity = '0';
      card.style.transform = 'translateY(20px)';
      card.style.transition = 'all 0.6s cubic-bezier(0.4, 0, 0.2, 1)';

      // Los datos ya vienen procesados del backend optimizado
      const typeInfo = {
        key: registro.tipo,
        title: registro.tipo_nombre,
        subtitle: registro.tipo_descripcion,
        badge: getBadgeText(registro.tipo),
        icon: getIconForType(registro.tipo)
      };

      card.setAttribute('data-type', registro.tipo);
      
      // Calcular tiempo restante para eliminar
      const createdAt = new Date(registro.created_at || registro.fecha);
      const now = new Date();
      const hoursElapsed = Math.floor((now - createdAt) / (1000 * 60 * 60));
      const hoursRemaining = 24 - hoursElapsed;
      
      // Determinar estado de alerta
      let alertInfo = null;
      if (registro.puede_cancelar && hoursRemaining <= 6) {
        alertInfo = {
          type: 'warning',
          message: `⚠️ Se puede eliminar por ${hoursRemaining}h más`,
          class: 'alert-warning'
        };
      } else if (!registro.puede_cancelar) {
        alertInfo = {
          type: 'expired',
          message: '🔒 No se puede eliminar (más de 24h)',
          class: 'alert-expired'
        };
      }

      // Botón de eliminar habilitado/deshabilitado según puede_cancelar
      const deleteButtonClass = registro.puede_cancelar ? 'action-btn delete-btn' : 'action-btn delete-btn disabled';
      const deleteButtonProps = registro.puede_cancelar ? '' : 'disabled title="No se puede eliminar (más de 24h)"';
      
      // Agregar clase de alerta a la tarjeta si existe
      if (alertInfo) {
        card.classList.add(alertInfo.class);
      }
      
      card.innerHTML = `
        ${alertInfo ? `<div class="card-alert ${alertInfo.class}">
          <i class="bi ${alertInfo.type === 'warning' ? 'bi-exclamation-triangle' : 'bi-lock'}"></i>
          <span>${alertInfo.message}</span>
        </div>` : ''}
        <div class="card-header">
          <div class="hora-icon ${registro.tipo}">
            <i class="${typeInfo.icon}"></i>
          </div>
          <div class="hora-info">
            <h4 class="hora-title">${typeInfo.title}</h4>
            <p class="hora-subtitle">${typeInfo.subtitle}</p>
          </div>
          <div class="hora-badge badge-${registro.tipo}">
            ${typeInfo.badge}
          </div>
        </div>
        <div class="card-body">
          <div class="hora-amount">${registro.total_horas}h</div>
          <div class="hora-details">
            <div class="detail-date">
              <i class="bi bi-calendar3"></i>
              ${registro.fecha}
            </div>
            <div class="detail-actions">
              <button class="action-btn" onclick="editHora(${registro.id})" title="Editar">
                <i class="bi bi-pencil"></i>
              </button>
              <button class="${deleteButtonClass}" onclick="deleteHora(${registro.id})" ${deleteButtonProps} title="Eliminar">
                <i class="bi bi-trash"></i>
              </button>
            </div>
          </div>
        </div>
      `;

      return card;
    }

    // Create a single hora card - MANTENER COMPATIBILIDAD
    function createHoraCard(hora) {
      const card = document.createElement('div');
      card.className = 'hora-card';
      card.style.opacity = '0';
      card.style.transform = 'translateY(20px)';
      card.style.transition = 'all 0.6s cubic-bezier(0.4, 0, 0.2, 1)';

      // Determine type and styling
      const typeInfo = getHoraTypeInfo(hora);
      const formattedDate = formatDate(hora.fecha);
      const formattedHours = formatHours(hora.horas_reales, hora.horas_justificadas);

      card.setAttribute('data-type', typeInfo.key);
      
      card.innerHTML = `
        <div class="card-header">
          <div class="hora-icon ${typeInfo.key}">
            <i class="${typeInfo.icon}"></i>
          </div>
          <div class="hora-info">
            <h4 class="hora-title">${typeInfo.title}</h4>
            <p class="hora-subtitle">${typeInfo.subtitle}</p>
          </div>
          <div class="hora-badge badge-${typeInfo.key}">
            ${typeInfo.badge}
          </div>
        </div>
        <div class="card-body">
          <div class="hora-amount">${formattedHours.display}</div>
          <div class="hora-details">
            <div class="detail-date">
              <i class="bi bi-calendar3"></i>
              ${formattedDate}
            </div>
            <div class="detail-actions">
              <button class="action-btn" onclick="editHora(${hora.id})" title="Editar">
                <i class="bi bi-pencil"></i>
              </button>
              <button class="action-btn delete-btn" onclick="deleteHora(${hora.id})" title="Eliminar">
                <i class="bi bi-trash"></i>
              </button>
            </div>
          </div>
        </div>
      `;

      return card;
    }

    // Helper functions
    function getHoraTypeInfo(hora) {
      const horasReales = parseFloat(hora.horas_reales) || 0;
      const horasJustificadas = parseFloat(hora.horas_justificadas) || 0;

      if (horasReales > 0 && horasJustificadas > 0) {
        return {
          key: 'mixtas',
          title: 'Horas Mixtas',
          subtitle: 'Reales + Justificadas',
          badge: 'Mixta',
          icon: 'bi-layers'
        };
      } else if (horasJustificadas > 0) {
        return {
          key: 'justificacion',
          title: 'Justificación',
          subtitle: hora.descripcion_justificacion || 'Horas justificadas',
          badge: 'Justificación',
          icon: 'bi-file-earmark-text'
        };
      } else {
        return {
          key: 'horas-reales',
          title: 'Horas Trabajadas',
          subtitle: hora.descripcion || 'Horas de trabajo',
          badge: 'Reales',
          icon: 'bi-clock'
        };
      }
    }

    function formatHours(horasReales, horasJustificadas) {
      const reales = parseFloat(horasReales) || 0;
      const justificadas = parseFloat(horasJustificadas) || 0;
      const total = reales + justificadas;

      if (reales > 0 && justificadas > 0) {
        return {
          display: `${total.toFixed(1)}h`,
          detail: `${reales}h + ${justificadas}h`
        };
      } else if (justificadas > 0) {
        return {
          display: `${justificadas.toFixed(1)}h`,
          detail: 'Justificadas'
        };
      } else {
        return {
          display: `${reales.toFixed(1)}h`,
          detail: 'Trabajadas'
        };
      }
    }

    function formatDate(dateString) {
      if (!dateString) return 'N/A';
      
      try {

    /**
     * Actualizar progreso del plan de trabajo del mes vigente - VERSIÓN MEJORADA
     * Maneja específicamente el plan activo del mes actual
     */
    function updateProgressOptimized(progreso) {
      const progressHeader = document.querySelector('.progress-header h3');
      const progressSubtitle = document.querySelector('.progress-header p');
      const progressBar = document.getElementById('progress-bar');
      const progressText = document.getElementById('progress-percentage');
      const values = document.getElementById('progress-values');
      const finishedMsg = document.getElementById('progress-finished');
      const progressContainer = document.querySelector('.progress-dashboard');

      if (!progreso) {
        // No hay plan de trabajo vigente
        if (progressHeader) progressHeader.textContent = 'Sin Plan Asignado';
        if (progressSubtitle) {
          const now = new Date();
          const mes = now.toLocaleDateString('es-ES', { month: 'long' });
          const anio = now.getFullYear();
          progressSubtitle.textContent = `No hay plan para ${mes} ${anio}`;
        }
        if (progressBar) progressBar.style.width = '0%';
        if (progressText) progressText.textContent = '--';
        if (values) {
          values.innerHTML = `
            <div style="color: var(--text-secondary); font-style: italic; text-align: center;">
              <i class="bi bi-info-circle" style="margin-right: 0.5rem;"></i>
              No hay metas definidas para este mes
            </div>
          `;
        }
        if (finishedMsg) finishedMsg.style.display = 'none';
        if (progressContainer) {
          progressContainer.style.opacity = '0.7';
          progressContainer.style.background = 'var(--surface-variant)';
        }
        return;
      }

      // Restablecer estilo normal del contenedor
      if (progressContainer) {
        progressContainer.style.opacity = '1';
        progressContainer.style.background = 'var(--surface)';
      }

      // Actualizar título con información del plan
      if (progressHeader) {
        progressHeader.textContent = 'Plan de Trabajo';
      }
      
      if (progressSubtitle) {
        const now = new Date();
        const mes = now.toLocaleDateString('es-ES', { month: 'long' });
        const anio = now.getFullYear();
        const descripcion = progreso.plan?.descripcion || `${mes} ${anio}`;
        progressSubtitle.textContent = descripcion;
      }
      
      // Actualizar barra de progreso con animación suave
      if (progressBar) {
        setTimeout(() => {
          progressBar.style.width = Math.min(100, Math.max(0, progreso.porcentaje)) + '%';
          
          // Cambiar color según progreso
          if (progreso.completado) {
            progressBar.style.background = 'linear-gradient(135deg, var(--success), #22c55e)';
          } else if (progreso.porcentaje >= 75) {
            progressBar.style.background = 'linear-gradient(135deg, var(--info), #60a5fa)';
          } else if (progreso.porcentaje >= 50) {
            progressBar.style.background = 'linear-gradient(135deg, var(--warning), #fbbf24)';
          } else {
            progressBar.style.background = 'linear-gradient(135deg, var(--primary), var(--secondary))';
          }
        }, 200);
      }

      // Actualizar porcentaje en el centro de la barra
      if (progressText) {
        setTimeout(() => {
          progressText.textContent = Math.round(progreso.porcentaje) + '%';
          progressText.style.color = progreso.porcentaje > 50 ? 'white' : 'var(--text-primary)';
        }, 200);
      }
      
      // Mostrar información detallada del progreso
      if (values) {
        const horasReales = progreso.horas_reales || 0;
        const horasJustificadas = progreso.horas_justificadas || 0;
        const horasCumplidas = progreso.horas_cumplidas || 0;
        const horasRequeridas = progreso.horas_requeridas || 0;
        const horasRestantes = Math.max(0, horasRequeridas - horasCumplidas);

        let desglose = '';
        if (horasJustificadas > 0) {
          desglose = `
            <div style="font-size: 0.85rem; margin-bottom: 0.5rem; color: var(--text-secondary);">
              <span style="color: var(--success);">${horasReales}h reales</span>
              ${horasJustificadas > 0 ? `+ <span style="color: var(--warning);">${horasJustificadas}h justif.</span>` : ''}
            </div>
          `;
        }

        values.innerHTML = `
          ${desglose}
          <div style="font-weight: 700; color: var(--primary); font-size: 1.1rem;">
            ${horasCumplidas} / ${horasRequeridas} horas
          </div>
          ${horasRestantes > 0 ? `
            <div style="font-size: 0.8rem; color: var(--text-secondary); margin-top: 0.5rem;">
              <i class="bi bi-clock" style="margin-right: 0.25rem;"></i>
              Faltan ${horasRestantes}h
            </div>
          ` : ''}
        `;
      }
      
      // Mostrar mensaje de finalización si completó el plan
      if (progreso.completado) {
        if (finishedMsg) {
          finishedMsg.style.display = 'flex';
          finishedMsg.innerHTML = `
            <i class="bi bi-check-circle-fill"></i>
            <span>¡Plan del mes completado!</span>
          `;
        }
      } else {
        if (finishedMsg) finishedMsg.style.display = 'none';
      }

      console.log('Progreso actualizado en interfaz:', {
        porcentaje: progreso.porcentaje,
        completado: progreso.completado,
        horas_cumplidas: progreso.horas_cumplidas,
        horas_requeridas: progreso.horas_requeridas
      });
    }

    function animateNumber(elementId, finalValue) {
      const element = document.getElementById(elementId);
      if (!element) return;

      const startValue = 0;
      const increment = finalValue / 30; // 30 frames
      let current = startValue;

      const timer = setInterval(() => {
        current += increment;
        if (current >= finalValue) {
          current = finalValue;
          clearInterval(timer);
        }
        element.textContent = Math.round(current * 10) / 10;
      }, 50);
    }

      // Verificar si el botón está deshabilitado

      if (button && button.disabled) {
        mostrarMensaje('No se puede eliminar este registro. Han pasado más de 24 horas desde su creación.', 'error');
        return;

      if (!confirmed) {
        return;
      }

      try {
        const token = localStorage.getItem('access_token');
        if (!token) {
          mostrarMensaje('No hay token de autenticación', 'error');
          return;
        }

        // Mostrar indicador de carga
        const loadingCard = button.closest('.hora-card');
        if (loadingCard) {
          loadingCard.style.opacity = '0.6';
          loadingCard.style.pointerEvents = 'none';
        }

        console.log('Eliminando hora con ID:', id);

        const response = await fetch(API_URLS.cooperativa.horasById(id), {
          method: 'DELETE',
          headers: {
            'Authorization': 'Bearer ' + token,
            'Content-Type': 'application/json'
          }
        });

        if (!response.ok) {
          const errorData = await response.json();
          throw new Error(errorData.message || `Error ${response.status}: ${response.statusText}`);
        }

        const result = await response.json();

        mostrarMensaje('Registro de horas eliminado exitosamente', 'success');

          loadingCard.style.pointerEvents = 'auto';
        }

        // Mostrar mensaje de error específico
        let errorMessage = 'Error al eliminar el registro de horas';
        if (error.message.includes('24 horas') || error.message.includes('tiempo')) {
          errorMessage = 'No se puede eliminar. Han pasado más de 24 horas desde la creación del registro.';
        } else if (error.message) {
          errorMessage = error.message;
        }
        
        mostrarMensaje(errorMessage, 'error');
      }
    }

    /**
     * Cargar progreso del plan de trabajo del mes vigente
     * Obtiene el plan de trabajo activo y calcula el progreso basado en horas registradas
     */
    async function cargarProgresoMesVigente() {
      console.log('Cargando progreso del plan de trabajo del mes vigente...');
      
      const token = localStorage.getItem('access_token');
      if (!token) {
        mostrarErrorProgreso('No se encontró token de autenticación');
        return;
      }
      
      const now = new Date();
      const mes = now.getMonth() + 1;
      const anio = now.getFullYear();
      
      try {
        // 1. Obtener el plan de trabajo del mes vigente
        const planResponse = await fetch(API_URLS.cooperativa.planesTrabajoList(), {
          headers: { 
            'Authorization': 'Bearer ' + token,
            'Accept': 'application/json'
          }
        });
        
        if (!planResponse.ok) {
          throw new Error(`Error al obtener planes: ${planResponse.status}`);
        }
        
        const planes = await planResponse.json();
        console.log('Planes obtenidos:', planes);
        
        // Buscar el plan del mes actual
        let planActual = null;
        if (Array.isArray(planes)) {
          planActual = planes.find(p => 
            parseInt(p.mes) === mes && 
            parseInt(p.anio) === anio
          );
        }
        
        if (!planActual) {
          mostrarSinPlan();
          return;
        }
        
        console.log('Plan actual encontrado:', planActual);
        
        // 2. Obtener horas trabajadas del mes actual
        const horasResponse = await fetch(API_URLS.cooperativa.horasCalcular(), {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token,
            'Accept': 'application/json'
          },
          body: JSON.stringify({ mes, anio })
        });
        
        let horasTrabajadas = { total_horas: 0, horas_reales: 0, horas_justificadas: 0 };
        
        if (horasResponse.ok) {
          const horasData = await horasResponse.json();
          horasTrabajadas = {
            total_horas: horasData.total_horas || 0,
            horas_reales: horasData.horas_reales || 0,
            horas_justificadas: horasData.horas_justificadas || 0
          };
        } else {
          console.warn('Error al obtener horas trabajadas, usando valores por defecto');
        }
        
        console.log('Horas trabajadas:', horasTrabajadas);
        
        // 3. Calcular progreso
        const horasRequeridas = parseFloat(planActual.horas_requeridas) || 0;
        const horasCumplidas = horasTrabajadas.total_horas;
        const porcentaje = horasRequeridas > 0 ? Math.min(100, (horasCumplidas / horasRequeridas) * 100) : 0;
        const completado = horasCumplidas >= horasRequeridas;
        
        const progreso = {
          plan: planActual,
          horas_requeridas: horasRequeridas,
          horas_cumplidas: horasCumplidas,
          horas_reales: horasTrabajadas.horas_reales,
          horas_justificadas: horasTrabajadas.horas_justificadas,
          porcentaje: porcentaje,
          completado: completado,
          mes: mes,
          anio: anio
        };
        
        // 4. Actualizar la interfaz
        updateProgressOptimized(progreso);
        
        console.log('Progreso calculado:', progreso);
        
      } catch (error) {
        console.error('Error al cargar progreso del plan:', error);
        mostrarErrorProgreso(`Error al cargar el progreso: ${error.message}`);
      }
    }

    /**

    function mostrarErrorProgreso(mensaje) {

      const progressValues = document.getElementById('progress-values');

      console.error('Error en progreso:', mensaje);
    }

      border-left: 4px solid #ffb74d;
    }
    .justificacion-row:hover {
      background-color: #ffe0b2 !important;
    }
    /* Filas mixtas (horas reales + justificación) */
    .horas-mixtas-row {
      background-color: #f3e5f5 !important;
      border-left: 4px solid #ab47bc;
    }
    .horas-mixtas-row:hover {
      background-color: #e1bee7 !important;
    }
    .facturas-table td {
      border-radius: 0 !important;
    }
    .btn-cancelar {
      background: #fff;
      color: #d81b60;
      border: 1px solid #d81b60;
      border-radius: 6px;
      padding: 7px 16px;
      font-size: 0.95rem;
      font-weight: 600;
      margin-left: 8px;
      transition: background 0.2s, color 0.2s;

  </style>
  
  <script>
    // Mobile menu functionality
    function toggleMenu() {
      const sidebar = document.getElementById('sidebarMenu');
      const overlay = document.getElementById('menuOverlay');
      const userDropdown = document.getElementById('userDropdownMobile');
      
      // Close user dropdown if open
      userDropdown.classList.remove('show');
      
      sidebar.classList.toggle('open');
      overlay.classList.toggle('active');
    }
    
    function closeMenu() {
      const sidebar = document.getElementById('sidebarMenu');
      const overlay = document.getElementById('menuOverlay');
      
      sidebar.classList.remove('open');
      overlay.classList.remove('active');
    }
    
    function toggleUserDropdown() {
      const dropdown = document.getElementById('userDropdownMobile');
      const sidebar = document.getElementById('sidebarMenu');
      const overlay = document.getElementById('menuOverlay');
      
      // Close sidebar if open
      sidebar.classList.remove('open');
      overlay.classList.remove('active');
      
      dropdown.classList.toggle('show');
    }
    
    // Close dropdowns when clicking outside
    document.addEventListener('click', function(event) {
      const userIcon = document.getElementById('userIconMobile');
      const userDropdown = document.getElementById('userDropdownMobile');
      
      if (!userIcon.contains(event.target) && !userDropdown.contains(event.target)) {
        userDropdown.classList.remove('show');
      }
    });
    
    // Initialize user icon
    function initUserIcon() {
      const userIcon = document.getElementById('userIconMobile');
      const token = localStorage.getItem('access_token');
      
      if (token) {
        userIcon.textContent = 'U';
      }
    }
    
    // Initialize on page load
    document.addEventListener('DOMContentLoaded', initUserIcon);
    
    // Logout function
    function logout() {
      localStorage.removeItem('access_token');
      window.location.href = 'index.html';
    }
  </script>
</body>
