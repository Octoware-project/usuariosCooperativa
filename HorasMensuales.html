<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Horas Mensuales</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="styles_tabla.css">
</head>

<body>
  <div id="navbar"></div>
  <div class="main-container">
    <div class="left-panel">
      <div class="facturas-box">
        <div class="facturas-header">
          <h2>Horas Mensuales</h2>
          <a href="AgregarHoras.html" class="btn btn-agregar">Agregar</a>
        </div>
        <table class="hours-table facturas-table">
          <thead>
            <tr>
              <th>Fecha</th>
              <th>Horas</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla-horas-tbody">
            <!-- Skeleton loader -->
            <tr class="skeleton-row">
              <td><div class="skeleton-box" style="width:80px;height:18px;"></div></td>
              <td><div class="skeleton-box" style="width:50px;height:18px;"></div></td>
              <td><div class="skeleton-box" style="width:90px;height:18px;"></div></td>
            </tr>
            <tr class="skeleton-row">
              <td><div class="skeleton-box" style="width:80px;height:18px;"></div></td>
              <td><div class="skeleton-box" style="width:50px;height:18px;"></div></td>
              <td><div class="skeleton-box" style="width:90px;height:18px;"></div></td>
            </tr>
            <tr class="skeleton-row">
              <td><div class="skeleton-box" style="width:80px;height:18px;"></div></td>
              <td><div class="skeleton-box" style="width:50px;height:18px;"></div></td>
              <td><div class="skeleton-box" style="width:90px;height:18px;"></div></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
    <div class="right-panel">
      <div class="clock-icon-container">
  <img id="progreso-icono" src="img/clock_icon.svg" alt="Reloj" class="clock-icon" />
      </div>
      <div class="progress-info">
        <div class="progress-label">Progreso del mes actual</div>
        
        <!-- Skeleton loader -->
        <div class="progress-bar-bg" id="progress-bar-bg-skeleton">
          <div class="skeleton-box" style="width:100%;height:24px;"></div>
        </div>
        
        <!-- Barra de progreso simple -->
        <div class="progress-bar-container" id="progress-bar-container" style="display:none;">
          <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progress-bar" style="width:0%"></div>
          </div>
        </div>
        
        <div class="progress-values" id="progress-values">&nbsp;</div>
        <div class="progress-finished" id="progress-finished" style="display:none;color:#27ae60;font-weight:600;margin-top:10px;text-align:center;">Plan del mes Terminado</div>
        <button id="btn-ver-planes" class="btn-ver-planes" style="margin:32px auto 0 auto;display:block;width:100%;max-width:260px;padding:12px 0;font-size:1.1rem;font-weight:600;background:#1976d2;color:#fff;border:none;border-radius:8px;box-shadow:0 2px 8px rgba(25,118,210,0.08);cursor:pointer;transition:background 0.2s;">Ver Planes de Trabajo</button>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="JavaScript/dashboard.js?v=2"></script>
  <script src="JavaScript/loader.js?v=2"></script>
  <script src="JavaScript/config.js"></script>
  <script src="JavaScript/horasmensuales.js?v=2"></script>
  <script>
    // Redirigir al hacer click en el botón de planes de trabajo
    document.addEventListener('DOMContentLoaded', function() {
      var btnPlanes = document.getElementById('btn-ver-planes');
      if (btnPlanes) {
        btnPlanes.addEventListener('click', function() {
          window.location.href = 'PlanesTrabajoUsuario.html';
        });
      }
    });
    // Mostrar skeleton loaders
    function mostrarSkeletons() {
      // Tabla
      const tbody = document.getElementById('tabla-horas-tbody');
      if (tbody) {
        Array.from(tbody.getElementsByClassName('skeleton-row')).forEach(row => row.style.display = '');
      }
      // Progreso
      const barSkeleton = document.getElementById('progress-bar-bg-skeleton');
      const barContainer = document.getElementById('progress-bar-container');
      if (barSkeleton) barSkeleton.style.display = '';
      if (barContainer) barContainer.style.display = 'none';
      const values = document.getElementById('progress-values');
      if (values) values.innerHTML = '&nbsp;';
    }

    // Ocultar skeleton loaders
    function ocultarSkeletons() {
      // Tabla
      const tbody = document.getElementById('tabla-horas-tbody');
      if (tbody) {
        Array.from(tbody.getElementsByClassName('skeleton-row')).forEach(row => row.style.display = 'none');
      }
      // Progreso
      const barSkeleton = document.getElementById('progress-bar-bg-skeleton');
      const barContainer = document.getElementById('progress-bar-container');
      if (barSkeleton) barSkeleton.style.display = 'none';
      if (barContainer) barContainer.style.display = '';
    }

    // Cargar progreso de horas trabajadas vs plan de trabajo actual
    async function cargarProgreso() {
      mostrarSkeletons();
      const token = localStorage.getItem('access_token');
      if (!token) return;
      const now = new Date();
      const mes = now.getMonth() + 1;
      const anio = now.getFullYear();
      let horasTrabajadas = 0;
      let horasReales = 0;
      let horasJustificadas = 0;
      let horasPlan = 0;
      let hayPlan = false;
  try {
        // Obtener horas trabajadas del mes actual (con desglose)
        const respHoras = await fetch(API_URLS.cooperativa.horasCalcular(), {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token
          },
          body: JSON.stringify({ mes, anio })
        });
        if (respHoras.ok) {
          const data = await respHoras.json();
          horasTrabajadas = data.total_horas || 0;
          horasReales = data.horas_reales || 0;
          horasJustificadas = data.horas_justificadas || 0;
        }
        // Obtener plan de trabajo actual del usuario
        const respPlan = await fetch(API_URLS.cooperativa.planesTrabajoList(), {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        if (respPlan.ok) {
          const planes = await respPlan.json();
          if (Array.isArray(planes)) {
            const plan = planes.find(p => p.mes == mes && p.anio == anio);
            if (plan) {
              horasPlan = plan.horas_requeridas || 0;
              hayPlan = true;
            }
          }
        }
  } catch {}
  // Ocultar skeletons y mostrar datos reales
  ocultarSkeletons();
  // Actualizar barras y valores
      const progressBar = document.getElementById('progress-bar');
      const values = document.getElementById('progress-values');
      const icono = document.getElementById('progreso-icono');
      const finishedMsg = document.getElementById('progress-finished');
      
      let percentTotal = 0;
      
      if (horasPlan > 0) {
        percentTotal = Math.min(100, (horasTrabajadas / horasPlan) * 100);
      }
      
      // Actualizar barra de progreso simple
      if (progressBar) progressBar.style.width = percentTotal + '%';
      
      if (hayPlan) {
        // Mostrar desglose si hay horas justificadas
        if (horasJustificadas > 0) {
          values.textContent = `${horasReales}h reales + ${horasJustificadas.toFixed(1)}h justif. = ${horasTrabajadas.toFixed(1)} / ${horasPlan} horas`;
        } else {
          values.textContent = `${horasReales} / ${horasPlan} horas`;
        }
        
        if (percentTotal >= 100) {
          if (icono) icono.src = 'img/approved_icon.svg';
          if (finishedMsg) finishedMsg.style.display = 'block';
        } else {
          if (icono) icono.src = 'img/clock_icon.svg';
          if (finishedMsg) finishedMsg.style.display = 'none';
        }
      } else {
        values.textContent = 'No hay plan de trabajo vigente';
        if (progressBar) progressBar.style.width = '0%';
        if (icono) icono.src = 'img/clock_icon.svg';
        if (finishedMsg) finishedMsg.style.display = 'none';
      }
    }
    cargarProgreso();
  </script>
  <style>
    .skeleton-box {
      background: linear-gradient(90deg, #e0e0e0 25%, #f5f5f5 50%, #e0e0e0 75%);
      border-radius: 6px;
      animation: skeleton-loading 1.2s infinite linear;
      display: inline-block;
    }
    @keyframes skeleton-loading {
      0% { background-position: -200px 0; }
      100% { background-position: calc(200px + 100%) 0; }
    }
    #navbar {
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .main-container {
      display: flex;
      justify-content: center;
      align-items: stretch;
      min-height: 100vh;
      padding: 48px 0 48px 0;
      gap: 32px;
      background: transparent;
      border-radius: 0;
      box-shadow: none;
      margin: 56px 0 32px 0;
    }
    .left-panel {
      flex: 2;
      min-width: 350px;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    .right-panel {
      flex: 1;
      min-width: 300px;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      background: rgba(255,255,255,0.7);
      border-radius: 18px;
      box-shadow: 0 2px 12px rgba(25,118,210,0.08);
      padding: 32px 24px 24px 24px;
      margin-top: 0;
      height: 100%;
      /* Ahora la altura es igual a la de la tabla */
    }
    .clock-icon-container {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 32px;
    }
    .clock-icon {
      width: 80px;
      height: 80px;
      display: block;
    }
    .progress-info {
      width: 100%;
      margin-top: 8px;
    }
    .progress-label {
      font-size: 1.1rem;
      color: #1976d2;
      font-weight: 600;
      margin-bottom: 8px;
      text-align: center;
    }
    .progress-bar-bg {
      width: 100%;
      height: 24px;
      background: #e3f2fd;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 8px;
      box-shadow: 0 1px 4px rgba(25,118,210,0.08);
      position: relative;
      display: flex;
    }
    .progress-bar-container {
      width: 100%;
    }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #1976d2 60%, #42a5f5 100%);
      border-radius: 12px;
      transition: width 0.6s cubic-bezier(.4,2,.3,1);
    }
    .progress-values {
      text-align: center;
      font-size: 1rem;
      color: #1976d2;
      font-weight: 500;
    }
  body {
      background: linear-gradient(135deg, #FFC1E3 0%, #A3D8F4 100%);
    }
    .facturas-container {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 48px 0 48px 0;
    }
    .facturas-box {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 32px 32px 24px 32px;
      min-width: 350px;
      max-width: 1200px;
      width: 100%;
    }
    .facturas-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }
    .facturas-header h2 {
      margin: 0;
      font-size: 2rem;
      color: #d81b60;
      font-weight: 700;
      letter-spacing: 1px;
    }
    .btn-agregar {
      background: #d81b60;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 10px 22px;
      font-size: 1rem;
      font-weight: 600;
      transition: background 0.2s;
      box-shadow: 0 2px 8px rgba(216,27,96,0.08);
    }
    .btn-agregar:hover {
      background: #ad1457;
    }
    .facturas-table thead {
      background: #C8EAF1 ;
    }
    .facturas-table thead th {
      color: #154360;
      font-weight: 700;
      font-size: 1.1rem;
      border-bottom: 2px solid #C8EAF1;
      border-radius: 0 !important;
    }
    .facturas-table tbody tr {
      transition: background 0.2s;
      border-radius: 0 !important;
    }
    .facturas-table tbody tr:hover {
      background: #C8EAF1;
    }
    /* Filas de horas reales */
    .horas-reales-row {
      background-color: #f5f5f5 !important;
      border-left: 4px solid #90a4ae;
    }
    .horas-reales-row:hover {
      background-color: #e8e8e8 !important;
    }
    /* Filas de justificaciones */
    .justificacion-row {
      background-color: #fff3e0 !important;
      border-left: 4px solid #ffb74d;
    }
    .justificacion-row:hover {
      background-color: #ffe0b2 !important;
    }
    /* Filas mixtas (horas reales + justificación) */
    .horas-mixtas-row {
      background-color: #f3e5f5 !important;
      border-left: 4px solid #ab47bc;
    }
    .horas-mixtas-row:hover {
      background-color: #e1bee7 !important;
    }
    .facturas-table td {
      border-radius: 0 !important;
    }
    .btn-cancelar {
      background: #fff;
      color: #d81b60;
      border: 1px solid #d81b60;
      border-radius: 6px;
      padding: 7px 16px;
      font-size: 0.95rem;
      font-weight: 600;
      margin-left: 8px;
      transition: background 0.2s, color 0.2s;
    }
    .btn-cancelar:hover:not([disabled]) {
      background: #f8bbd0;
      color: #ad1457;
    }
    .btn-cancelar[disabled] {
      opacity: 0.5;
      cursor: not-allowed;
      background: #f5f5f5;
      color: #999;
      border-color: #ddd;
    }
    .btn-group {
      margin-top: 18px;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }
    @media (max-width: 600px) {
      .facturas-box {
        padding: 16px 4px 12px 4px;
        min-width: unset;
        max-width: 100vw;
      }
      .facturas-header h2 {
        font-size: 1.3rem;
      }
      .btn-agregar {
        padding: 8px 12px;
        font-size: 0.95rem;
      }
    }
  </style>
</body>

</html>
