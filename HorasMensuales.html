<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Horas Mensuales</title>
  <link rel="icon" type="image/jpeg" href="img/Logo.jpg">
  
  <script>
    (function() {
      const savedTheme = localStorage.getItem('theme') || 'dark';
      const themes = {
        light: {
          '--primary': '#d946a6',
          '--primary-rgb': '217, 70, 166',
          '--primary-light': '#f3e8f8',
          '--primary-dark': '#b8388a',
          '--surface': '#ffffff',
          '--surface-variant': '#f8f9fa',
          '--surface-hover': '#f0f0f0',
          '--bg-gradient': '#ffffff',
          '--text-primary': '#1f2937',
          '--text-secondary': '#6b7280',
          '--text-muted': '#9ca3af',
          '--border': '#e5e7eb',
          '--shadow-sm': '0 1px 2px rgba(0, 0, 0, 0.05)',
          '--shadow-md': '0 4px 6px rgba(0, 0, 0, 0.1)',
          '--shadow-lg': 'none',
          '--success': '#10b981',
          '--warning': '#f59e0b',
          '--error': '#ef4444',
          '--info': '#3b82f6',
          '--btn-primary-bg': '#d946a6',
          '--btn-primary-hover': '#b8388a',
          '--navbar-bg': 'rgba(255, 255, 255, 0.98)',
          '--navbar-shadow': '0 2px 10px rgba(0, 0, 0, 0.05)',
          '--navbar-border': 'rgba(226, 232, 240, 0.5)',
          '--sidebar-bg': '#ffffff',
          '--sidebar-header-bg': 'linear-gradient(135deg, #e9d5ff 0%, #ddd6fe 100%)',
          '--sidebar-hover': 'rgba(217, 70, 166, 0.08)'
        },
        dark: {
          '--primary': '#ec4899',
          '--primary-rgb': '236, 72, 153',
          '--primary-light': '#f472b6',
          '--primary-dark': '#db2777',
          '--surface': '#1e2128',
          '--surface-variant': '#282c34',
          '--surface-hover': '#2d3139',
          '--bg-gradient': '#404041',
          '--text-primary': '#e4e4e7',
          '--text-secondary': '#d1d5db',
          '--text-muted': '#9ca3af',
          '--border': '#3f3f46',
          '--shadow-sm': '0 1px 2px rgba(0, 0, 0, 0.3)',
          '--shadow-md': '0 4px 6px rgba(0, 0, 0, 0.4)',
          '--shadow-lg': 'none',
          '--success': '#10b981',
          '--warning': '#f59e0b',
          '--error': '#ef4444',
          '--info': '#ec4899',
          '--btn-primary-bg': '#ec4899',
          '--btn-primary-hover': '#f472b6',
          '--navbar-bg': 'rgba(30, 33, 40, 0.98)',
          '--navbar-shadow': '0 2px 10px rgba(0, 0, 0, 0.3)',
          '--navbar-border': 'rgba(63, 63, 70, 0.5)',
          '--sidebar-bg': '#1e2128',
          '--sidebar-header-bg': 'linear-gradient(135deg, #be185d 0%, #ec4899 100%)',
          '--sidebar-hover': 'rgba(236, 72, 153, 0.15)'
        }
      };
      const theme = themes[savedTheme];
      if (theme) {
        Object.entries(theme).forEach(([key, value]) => {
          document.documentElement.style.setProperty(key, value);
        });
      }
    })();
  </script>
  
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
  
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="Styles/HideScrollbar.css">
  <link rel="stylesheet" href="Styles/AntiFlash.css">
  <link rel="stylesheet" href="Styles/PageLoader.css">
  <link rel="stylesheet" href="Styles/NavbarSkeleton.css">
  <link rel="stylesheet" href="Styles/Navbar.css">
  
  <script src="JavaScript/theme.js"></script>
  
  <script src="JavaScript/i18n.js"></script>
  
  <link rel="stylesheet" href="Styles/HorasMensuales.css">
</head>

<body>
  
  <div id="navbar"></div>

  <div class="horas-container">
    <div class="horas-content">
      
      <div class="modern-header">
        <div class="header-title">
          <h2><i class="bi bi-clock-history"></i> <span data-i18n="hours.title">Horas Mensuales</span></h2>
          <p class="header-subtitle" data-i18n="hours.subtitle">Registra y gestiona tus horas de trabajo mensuales</p>
        </div>
        <div class="header-actions">
          <button class="btn btn-filter" onclick="toggleFilters()">
            <i class="bi bi-funnel"></i> <span data-i18n="common.filter">Filtros</span>
          </button>
          <a href="AgregarHoras.html" class="btn btn-primary-modern">
            <i class="bi bi-plus-circle"></i> <span data-i18n="hours.add_hours">Agregar Horas</span>
          </a>
        </div>
      </div>

      <div class="filters-panel" id="filtersPanel">
        <div class="filters-content">
          <div class="filter-group">
            <label class="filter-label">
              <i class="bi bi-funnel"></i><span data-i18n="hours.filterByType">Filtrar por tipo</span>
            </label>
            <div class="filter-chips">
              <div class="chip active" onclick="filterByType('all')">
                <i class="bi bi-collection"></i><span data-i18n="common.all">Todas</span>
              </div>
              <div class="chip" onclick="filterByType('horas-reales')">
                <i class="bi bi-clock"></i><span data-i18n="hours.realHours">Horas Reales</span>
              </div>
              <div class="chip" onclick="filterByType('justificacion')">
                <i class="bi bi-file-earmark-text"></i><span data-i18n="hours.justifications">Justificaciones</span>
              </div>
            </div>
          </div>
          <div class="filter-group">
            <label class="filter-label">
              <i class="bi bi-calendar-month"></i><span data-i18n="hours.searchByDate">Buscar por fecha</span>
            </label>
            <div class="search-input-group">
              <input type="text" class="search-input" id="searchInput" data-i18n-placeholder="hours.searchPlaceholder" placeholder="Buscar por fecha o descripción...">
              <button class="search-btn" onclick="searchHoras()">
                <i class="bi bi-search"></i>
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="horas-main-layout">
        
        <div class="horas-left-panel">
          <div class="horas-grid" id="horasGrid">
            <div class="hora-card skeleton" id="skeletonLoader">
              <div class="card-header">
                <div class="skeleton-avatar"></div>
                <div class="skeleton-info">
                  <div class="skeleton-line skeleton-title"></div>
                  <div class="skeleton-line skeleton-subtitle"></div>
                </div>
                <div class="skeleton-badge"></div>
              </div>
              <div class="card-body">
                <div class="skeleton-line skeleton-amount"></div>
                <div class="skeleton-line skeleton-date"></div>
              </div>
            </div>
            <div class="hora-card skeleton">
              <div class="card-header">
                <div class="skeleton-avatar"></div>
                <div class="skeleton-info">
                  <div class="skeleton-line skeleton-title"></div>
                  <div class="skeleton-line skeleton-subtitle"></div>
                </div>
                <div class="skeleton-badge"></div>
              </div>
              <div class="card-body">
                <div class="skeleton-line skeleton-amount"></div>
                <div class="skeleton-line skeleton-date"></div>
              </div>
            </div>
            <div class="hora-card skeleton">
              <div class="card-header">
                <div class="skeleton-avatar"></div>
                <div class="skeleton-info">
                  <div class="skeleton-line skeleton-title"></div>
                  <div class="skeleton-line skeleton-subtitle"></div>
                </div>
                <div class="skeleton-badge"></div>
              </div>
              <div class="card-body">
                <div class="skeleton-line skeleton-amount"></div>
                <div class="skeleton-line skeleton-date"></div>
              </div>
            </div>
          </div>
        </div>

        <div class="horas-right-panel">
          <div class="progress-dashboard">
            <div class="progress-header">
              <div class="progress-icon-container">
                <img id="progreso-icono" src="img/clock_icon.svg" alt="Reloj" class="progress-icon" />
              </div>
              <h3 data-i18n="hours.monthlyProgress">Progreso Mensual</h3>
              <p data-i18n="hours.progressTracking">Seguimiento de horas del mes actual</p>
            </div>
            
            <div class="progress-content">
              <div class="progress-skeleton" id="progress-bar-bg-skeleton">
                <div class="skeleton-line" style="height: 32px; margin-bottom: 1rem;"></div>
                <div class="skeleton-line" style="height: 16px; width: 60%;"></div>
              </div>
              
              <div class="progress-container" id="progress-bar-container" style="display:none;">
                <div class="progress-bar-wrapper">
                  <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="progress-bar" style="width:0%"></div>
                    <div class="progress-text" id="progress-percentage">0%</div>
                  </div>
                </div>
                <div class="progress-details">
                  <div class="progress-values" id="progress-values"></div>
                  <div class="progress-finished" id="progress-finished" style="display:none;">
                    <i class="bi bi-check-circle-fill"></i>
                    <span data-i18n="hours.monthCompleted">Plan del mes completado</span>
                  </div>
                </div>
              </div>

              <div class="quick-stats">
                <div class="stat-item">
                  <div class="stat-icon success">
                    <i class="bi bi-clock-fill"></i>
                  </div>
                  <div class="stat-info">
                    <div class="stat-number" id="stat-horas-reales">0</div>
                    <div class="stat-label" data-i18n="hours.realHours">Horas Reales</div>
                  </div>
                </div>
                <div class="stat-item">
                  <div class="stat-icon warning">
                    <i class="bi bi-file-text-fill"></i>
                  </div>
                  <div class="stat-info">
                    <div class="stat-number" id="stat-justificaciones">0</div>
                    <div class="stat-label" data-i18n="hours.justifications">Justificaciones</div>
                  </div>
                </div>
              </div>

              <button id="btn-ver-planes" class="btn-action-modern">
                <i class="bi bi-calendar-check"></i>
                <span data-i18n="hours.viewWorkPlans">Ver Planes de Trabajo</span>
              </button>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="JavaScript/universal-loader.js"></script>
  <script src="JavaScript/navbar-skeleton.js"></script>
  <script src="JavaScript/page-loader.js"></script>
  <script src="JavaScript/config.js"></script>
  <script src="JavaScript/loader.js?v=2"></script>
  <script src="JavaScript/navbar-functions.js"></script>
  <script src="JavaScript/mobile-navbar.js"></script>
  <script src="JavaScript/horasmensuales.js"></script>
  <script src="JavaScript/dashboard.js?v=2"></script>
  <script src="JavaScript/Navbar.js"></script>

</body>

</html>
