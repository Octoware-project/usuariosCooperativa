    <style>
      /* Mobile Navigation Styles */
      .mobile-nav {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(20px);
        padding: 1rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 1000;
        box-shadow: 0 2px 20px rgba(249, 168, 212, 0.2);
        border-bottom: 1px solid rgba(249, 168, 212, 0.1);
      }
      
      .menu-btn {
        background: none;
        border: none;
        font-size: 1.5rem;
        color: #ec4899;
        cursor: pointer;
        padding: 0.5rem;
        border-radius: 8px;
        transition: all 0.2s ease;
      }
      
      .menu-btn:hover {
        background: rgba(236, 72, 153, 0.1);
        transform: scale(1.05);
      }
      
      .user-icon-mobile {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: linear-gradient(135deg, #f9a8d4 0%, #ec4899 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: 700;
        font-size: 1.2rem;
        box-shadow: 0 4px 12px rgba(249, 168, 212, 0.4);
        transition: all 0.2s ease;
        cursor: pointer;
      }
      
      .user-icon-mobile:hover {
        transform: scale(1.05);
        box-shadow: 0 6px 16px rgba(236, 72, 153, 0.5);
      }
      
      /* Sidebar Menu */
      .sidebar-menu {
        position: fixed;
        top: 0;
        left: -300px;
        width: 280px;
        height: 100vh;
        background: white;
        box-shadow: 4px 0 20px rgba(0, 0, 0, 0.15);
        z-index: 1001;
        transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        overflow-y: auto;
      }
      
      .sidebar-menu.open {
        left: 0;
      }
      
      .sidebar-header {
        background: linear-gradient(135deg, #f9a8d4 0%, #c084fc 100%);
        padding: 2rem 1.5rem;
        color: white;
        text-align: center;
      }
      
      .sidebar-header h3 {
        margin: 0;
        font-size: 1.3rem;
        font-weight: 600;
      }
      
      .sidebar-header p {
        margin: 0.5rem 0 0 0;
        opacity: 0.9;
        font-size: 0.9rem;
      }
      
      .sidebar-nav {
        padding: 1rem 0;
        display: flex;
        flex-direction: column;
      }
      
      .sidebar-nav a {
        display: flex;
        align-items: center;
        padding: 1rem 1.5rem;
        color: #334155;
        text-decoration: none;
        font-weight: 500;
        transition: all 0.2s ease;
        border-bottom: 1px solid #f1f5f9;
        width: 100%;
        box-sizing: border-box;
      }
      
      .sidebar-nav a:last-child {
        border-bottom: none;
      }
      
      .sidebar-nav a:hover {
        background: #ffc1e3;
        color: #ec4899;
        transform: translateX(5px);
      }
      
      .sidebar-nav a i {
        width: 20px;
        margin-right: 1rem;
        font-size: 1.1rem;
      }
      
      .sidebar-nav .divider {
        height: 1px;
        background: #e2e8f0;
        margin: 0.5rem 1.5rem;
        flex-shrink: 0;
      }
      
      /* Overlay */
      .menu-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        z-index: 999;
        opacity: 0;
        visibility: hidden;
        transition: all 0.3s ease;
      }
      
      .menu-overlay.active {
        opacity: 1;
        visibility: visible;
      }
      
      /* User dropdown mobile */
      .user-dropdown-mobile {
        position: absolute;
        top: 60px;
        right: 1rem;
        background: white;
        border-radius: 12px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        min-width: 180px;
        opacity: 0;
        visibility: hidden;
        transform: translateY(-10px);
        transition: all 0.3s ease;
        z-index: 1002;
      }
      
      .user-dropdown-mobile.show {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
      }
      
      .user-dropdown-mobile a {
        display: flex;
        align-items: center;
        padding: 0.75rem 1rem;
        color: #334155;
        text-decoration: none;
        font-weight: 500;
        transition: all 0.2s ease;
        border-bottom: 1px solid #f1f5f9;
      }
      
      .user-dropdown-mobile a:last-child {
        border-bottom: none;
        border-radius: 0 0 12px 12px;
      }
      
      .user-dropdown-mobile a:first-child {
        border-radius: 12px 12px 0 0;
      }
      
      .user-dropdown-mobile a:hover {
        background: #ffc1e3;
        color: #ec4899;
      }
      
      .user-dropdown-mobile a i {
        width: 16px;
        margin-right: 0.75rem;
      }
      
      .btn-guardar:hover {
        color: #fff !important;
      }
      
      body {
        background: linear-gradient(135deg, #FFC1E3 0%, #A3D8F4 100%);
      }
      
      .form-container {
        background: #fff;
        border-radius: 16px;
        box-shadow: 0 4px 24px rgba(0,0,0,0.08);
        padding: 32px 32px 24px 32px;
        min-width: 350px;
        max-width: 600px;
        width: 100%;
        margin: 48px auto 0 auto;
      }
      
      .header {
        text-align: center;
        margin-top: 32px;
        margin-bottom: 16px;
      }
      
      /* Mobile Responsive */
      @media (min-width: 768px) {
        .mobile-nav {
          display: none;
        }
        
        .sidebar-menu,
        .menu-overlay,
        .user-dropdown-mobile {
          display: none;
        }
      }
      
      @media (max-width: 767px) {
        #navbar {
          display: none;
        }
        
        body {
          padding-top: 70px;
        }
        
        .header {
          padding: 1rem;
          text-align: center;
          margin-top: 1rem;
        }
        
        .header h2 {
          font-size: 1.4rem;
        }
        
        .form-container {
          padding: 1rem;
          margin: 0.5rem;
          min-width: unset;
          max-width: 100%;
        }
        
        .add-hours-form {
          padding: 1rem;
        }
        
        .add-hours-form label {
          font-size: 0.9rem;
          margin-bottom: 0.25rem;
        }
        
        .add-hours-form input,
        .add-hours-form select,
        .add-hours-form textarea {
          padding: 0.75rem;
          font-size: 0.9rem;
          margin-bottom: 1rem;
        }
        
        .btn {
          padding: 0.75rem 1.5rem;
          font-size: 0.9rem;
          width: 100%;
          margin-top: 1rem;
        }
      }
      
      @media (max-width: 600px) {
        .form-container {
          padding: 16px 4px 12px 4px;
          min-width: unset;
          max-width: 100vw;
          margin: 0.25rem;
        }
        
        .header h2 {
          font-size: 1.3rem;
        }
        
        .add-hours-form {
          padding: 0.75rem;
        }
        
        .add-hours-form label {
          font-size: 0.85rem;
        }
        
        .add-hours-form input,
        .add-hours-form select,
        .add-hours-form textarea {
          padding: 0.6rem;
          font-size: 0.85rem;
        }
        
        .btn {
          padding: 0.6rem 1rem;
          font-size: 0.85rem;
        }
      }
      
      @media (max-width: 480px) {
        .sidebar-menu {
          width: 260px;
        }
        
        .header h2 {
          font-size: 1.2rem;
        }
        
        .form-container {
          padding: 0.5rem;
          margin: 0.25rem;
        }
      }
    </style>

  <div class="header">
    <h2>Agregar Horas</h2>
  </div>
  <div class="form-container">
    <form class="add-hours-form" id="addHoursForm">
      <label for="anio">Año:</label>
      <input type="number" id="anio" name="anio" min="2000" max="2100" required>


      <label for="mes">Mes:</label>
      <select id="mes" name="mes" required>
        <option value="">Seleccione un mes</option>
        <option value="1">Enero</option>
        <option value="2">Febrero</option>
        <option value="3">Marzo</option>
        <option value="4">Abril</option>
        <option value="5">Mayo</option>
        <option value="6">Junio</option>
        <option value="7">Julio</option>
        <option value="8">Agosto</option>
        <option value="9">Septiembre</option>
        <option value="10">Octubre</option>
        <option value="11">Noviembre</option>
        <option value="12">Diciembre</option>
      </select>

      <label for="dia">Día:</label>
      <input type="number" id="dia" name="dia" min="1" max="31" required>

      <label for="Cantidad_Horas">Cantidad de Horas:</label>
  <input type="number" id="Cantidad_Horas" name="Cantidad_Horas" step="0.1" required>

      <button type="submit" class="btn">Guardar</button>
    </form>
    <div class="justificacion-container">
      <button id="btnJustificacion" class="btn btn-justificar">Subir Justificación</button>
    </div>
    <style>
      .btn-guardar {
        border-radius: 24px !important;
        padding-left: 32px !important;
        padding-right: 32px !important;
      }
      .justificacion-container {
        display: flex;
        justify-content: center;
        margin-top: 32px;
      }
      .btn-justificar {
        background: #1976d2 !important;
        color: #fff !important;
        border-radius: 18px !important;
        font-size: 0.95rem !important;
        padding: 8px 20px !important;
        min-width: 0;
        box-shadow: 0 2px 8px rgba(25,118,210,0.08);
        border: none;
      }
      .btn-justificar:hover {
        background: #115293 !important;
      }
    </style>

    <script src="JavaScript/config.js"></script>
    <script src="JavaScript/dashboard.js"></script>
    <script src="JavaScript/loader.js"></script>
    <script>
      // Set default year and month

      (function setDefaultYearMonthDay() {
        const now = new Date();
        document.getElementById('anio').value = now.getFullYear();
        document.getElementById('mes').value = (now.getMonth() + 1).toString();
        document.getElementById('dia').value = now.getDate();
      })();


      document.getElementById('addHoursForm').onsubmit = async function(e) {
        e.preventDefault();
        const form = e.target;
        const formData = new FormData(form);
        // Mostrar mensaje de estado
        let msg = document.getElementById('msg-estado');
        if (!msg) {
          msg = document.createElement('div');
          msg.id = 'msg-estado';
          msg.style.marginTop = '1rem';
          msg.style.fontWeight = 'bold';
          form.parentNode.appendChild(msg);
        }
        msg.textContent = 'Enviando...';
        msg.style.color = '#555';
        try {
          const token = localStorage.getItem('access_token');
          if (!token) {
            msg.textContent = 'No autenticado. Por favor, inicie sesión.';
            msg.style.color = 'red';
            setTimeout(() => { window.location.href = 'index.html'; }, 1500);
            return;
          }
          // Convertir FormData a objeto para JSON
          const data = {};
          formData.forEach((value, key) => { data[key] = value; });
          const response = await fetch(API_URLS.cooperativa.horas(), {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': 'Bearer ' + token
            },
            body: JSON.stringify(data)
          });
          if (response.ok) {
            msg.textContent = '¡Horas registradas exitosamente!';
            msg.style.color = 'green';
            setTimeout(() => { window.location.href = 'HorasMensuales.html'; }, 1200);
          } else {
            let errorMsg = 'Error al registrar horas';
            try {
              const text = await response.text();
              const data = JSON.parse(text);
              if (data && data.error) errorMsg += ': ' + data.error;
              else errorMsg += ': ' + text;
            } catch {
              // Si no es JSON
            }
            msg.textContent = errorMsg;
            msg.style.color = 'red';
          }
        } catch (err) {
          msg.textContent = 'Error de conexión con el servidor';
          msg.style.color = 'red';
          console.error('Error de red o JS:', err);
        }
      };

      document.getElementById('btnJustificacion').onclick = function() {
        window.location.href = 'AgregarJustificacion.html';
      };
      
      // Mobile Navigation Functions
      function toggleMenu() {
        const sidebarMenu = document.getElementById('sidebarMenu');
        const menuOverlay = document.getElementById('menuOverlay');
        
        sidebarMenu.classList.toggle('open');
        menuOverlay.classList.toggle('active');
      }
      
      function closeMenu() {
        const sidebarMenu = document.getElementById('sidebarMenu');
        const menuOverlay = document.getElementById('menuOverlay');
        
        sidebarMenu.classList.remove('open');
        menuOverlay.classList.remove('active');
      }
      
      function toggleUserDropdown() {
        const dropdown = document.getElementById('userDropdownMobile');
        dropdown.classList.toggle('show');
      }
      
      function logout() {
        alert('Cerrando sesión...');
        // Aquí iría la lógica de logout
        window.location.href = 'login.html';
      }
      
      // Close dropdown when clicking outside
      document.addEventListener('click', function(event) {
        const userIcon = document.getElementById('userIconMobile');
        const dropdown = document.getElementById('userDropdownMobile');
        
        if (!userIcon.contains(event.target) && !dropdown.contains(event.target)) {
          dropdown.classList.remove('show');
        }
      });
      
      // Close menu when clicking menu links
      document.querySelectorAll('.sidebar-nav a').forEach(link => {
        link.addEventListener('click', closeMenu);
      });
    </script>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
