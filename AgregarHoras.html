<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css"> 
    <link rel="stylesheet" href="styles_formulario.css">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    
    <!-- Google Fonts - Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <title>Agregar Horas</title>
    <style>
      /* Prevent horizontal scroll */
      html, body {
        overflow-x: hidden;
        max-width: 100%;
      }
      
      /* Color Variables */
      :root {
        --primary: #ec4899;
        --secondary: #c084fc;
        --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        --secondary-gradient: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        --success-gradient: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        --surface: #ffffff;
        --surface-variant: #f8fafc;
        --surface-hover: #f8fafc;
        --text-primary: #1e293b;
        --text-secondary: #64748b;
        --text-muted: #94a3b8;
        --border: #e2e8f0;
        --border-hover: #cbd5e1;
        --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
      }

      /* Mobile Navigation Styles */
      .mobile-nav {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(20px);
        padding: 1rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 1000;
        box-shadow: 0 2px 20px rgba(249, 168, 212, 0.2);
        border-bottom: 1px solid rgba(249, 168, 212, 0.1);
      }
      
      .menu-btn {
        background: none;
        border: none;
        font-size: 1.5rem;
        color: #ec4899;
        cursor: pointer;
        padding: 0.5rem;
        border-radius: 8px;
        transition: all 0.2s ease;
      }
      
      .menu-btn:hover {
        background: rgba(236, 72, 153, 0.1);
        transform: scale(1.05);
      }
      
      .user-icon-mobile {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: linear-gradient(135deg, #f9a8d4 0%, #ec4899 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: 700;
        font-size: 1.2rem;
        box-shadow: 0 4px 12px rgba(249, 168, 212, 0.4);
        transition: all 0.2s ease;
        cursor: pointer;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        border: none;
        outline: none;
      }
      
      .user-icon-mobile:hover {
        transform: scale(1.05);
        box-shadow: 0 6px 16px rgba(236, 72, 153, 0.5);
      }
      
      .user-icon-mobile:active {
        transform: scale(0.98);
        transition: all 0.1s ease;
      }
      
      .user-icon-mobile:focus {
        outline: none;
        box-shadow: 0 4px 12px rgba(249, 168, 212, 0.4);
      }
      
      /* Sidebar Menu */
      .sidebar-menu {
        position: fixed;
        top: 0;
        left: -300px;
        width: 280px;
        height: 100vh;
        background: white;
        box-shadow: 4px 0 20px rgba(0, 0, 0, 0.15);
        z-index: 1001;
        transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        overflow-y: auto;
      }
      
      .sidebar-menu.open {
        left: 0;
      }
      
      .sidebar-header {
        background: linear-gradient(135deg, #f9a8d4 0%, #c084fc 100%);
        padding: 2rem 1.5rem;
        color: white;
        text-align: center;
      }
      
      .sidebar-header h3 {
        margin: 0;
        font-size: 1.3rem;
        font-weight: 600;
      }
      
      .sidebar-header p {
        margin: 0.5rem 0 0 0;
        opacity: 0.9;
        font-size: 0.9rem;
      }
      
      .sidebar-nav {
        padding: 1rem 0;
        display: flex;
        flex-direction: column;
      }
      
      .sidebar-nav a {
        display: flex;
        align-items: center;
        padding: 1rem 1.5rem;
        color: #334155;
        text-decoration: none;
        font-weight: 500;
        transition: all 0.2s ease;
        border-bottom: 1px solid #f1f5f9;
        width: 100%;
        box-sizing: border-box;
      }
      
      .sidebar-nav a:last-child {
        border-bottom: none;
      }
      
      .sidebar-nav a:hover {
        background: #ffc1e3;
        color: #ec4899;
        transform: translateX(5px);
      }
      
      .sidebar-nav a i {
        width: 20px;
        margin-right: 1rem;
        font-size: 1.1rem;
      }
      
      .sidebar-nav .divider {
        height: 1px;
        background: #e2e8f0;
        margin: 0.5rem 1.5rem;
        flex-shrink: 0;
      }
      
      /* Overlay */
      .menu-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        z-index: 999;
        opacity: 0;
        visibility: hidden;
        transition: all 0.3s ease;
      }
      
      .menu-overlay.active {
        opacity: 1;
        visibility: visible;
      }
      
      /* User dropdown mobile */
      .user-dropdown-mobile {
        position: absolute;
        top: 60px;
        right: 1rem;
        background: white;
        border-radius: 12px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        min-width: 180px;
        opacity: 0;
        visibility: hidden;
        transform: translateY(-10px);
        transition: all 0.3s ease;
        z-index: 1002;
      }
      
      .user-dropdown-mobile.show {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
      }
      
      .user-dropdown-mobile a {
        display: flex;
        align-items: center;
        padding: 0.75rem 1rem;
        color: #334155;
        text-decoration: none;
        font-weight: 500;
        transition: all 0.2s ease;
        border-bottom: 1px solid #f1f5f9;
      }
      
      .user-dropdown-mobile a:last-child {
        border-bottom: none;
        border-radius: 0 0 12px 12px;
      }
      
      .user-dropdown-mobile a:first-child {
        border-radius: 12px 12px 0 0;
      }
      
      .user-dropdown-mobile a:hover {
        background: #ffc1e3;
        color: #ec4899;
      }
      
      .user-dropdown-mobile a i {
        width: 16px;
        margin-right: 0.75rem;
      }

      /* Modern Form Container */
      .modern-form-container {
        max-width: 800px;
        margin: 0 auto;
        padding: 2rem;
      }
      
      .form-header {
        display: flex;
        align-items: center;
        gap: 1rem;
        margin-bottom: 2rem;
        padding: 1.5rem;
        background: var(--surface);
        border-radius: 16px;
        box-shadow: var(--shadow-lg);
        border: 1px solid var(--border);
      }
      
      .back-button {
        width: 48px;
        height: 48px;
        border-radius: 12px;
        background: var(--surface-variant);
        border: 1px solid var(--border);
        color: var(--text-secondary);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.2s ease;
        font-size: 1.2rem;
        text-decoration: none;
      }
      
      .back-button:hover {
        background: var(--primary);
        color: white;
        transform: translateX(-2px);
      }
      
      .form-title h2 {
        margin: 0;
        font-size: 2rem;
        font-weight: 700;
        color: var(--text-primary);
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }
      
      .form-title h2 i {
        color: #667eea;
      }
      
      .form-title p {
        margin: 0.5rem 0 0 0;
        color: var(--text-secondary);
      }

      /* Form Card */
      .form-card {
        background: var(--surface);
        border-radius: 20px;
        box-shadow: var(--shadow-lg);
        border: 1px solid var(--border);
        overflow: hidden;
      }

      .form-content {
        padding: 2.5rem;
      }

      /* Date Selection Grid */
      .date-selection-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 1.5rem;
        margin-bottom: 2rem;
        padding: 1.5rem;
        background: rgba(102, 126, 234, 0.05);
        border-radius: 16px;
        border: 2px dashed rgba(102, 126, 234, 0.2);
      }

      .input-group {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      .form-label {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-weight: 600;
        color: var(--text-primary);
        font-size: 0.9rem;
        margin-bottom: 0.5rem;
      }

      .form-label i {
        color: #667eea;
        font-size: 1rem;
      }

      .form-input {
        padding: 0.875rem 1rem;
        border: 2px solid var(--border);
        border-radius: 12px;
        font-size: 1rem;
        background: var(--surface);
        transition: all 0.3s ease;
        outline: none;
      }

      .form-input:focus {
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        background: #fff;
      }

      .form-input:hover:not(:focus) {
        border-color: var(--border-hover);
      }

      .input-group.focused .form-label {
        color: #667eea;
      }

      .input-group.focused .form-label i {
        transform: scale(1.1);
      }

      /* Floating Labels */
      .floating-label {
        position: relative;
        margin-bottom: 2rem;
      }
      
      .floating-label input,
      .floating-label select {
        width: 100%;
        padding: 1.2rem 1rem 0.8rem 1rem;
        border: 2px solid var(--border);
        border-radius: 12px;
        font-size: 1rem;
        background: var(--surface);
        transition: all 0.3s ease;
        outline: none;
      }
      
      .floating-label input:focus,
      .floating-label select:focus {
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      }
      
      .floating-text {
        position: absolute;
        left: 1rem;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-muted);
        font-size: 1rem;
        font-weight: 500;
        transition: all 0.3s ease;
        pointer-events: none;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      
      .floating-text i {
        font-size: 1.1rem;
      }
      
      .floating-label input:focus + .floating-text,
      .floating-label input:valid + .floating-text,
      .floating-label select:focus + .floating-text,
      .floating-label select:valid + .floating-text {
        top: 0.75rem;
        font-size: 0.85rem;
        color: #667eea;
        transform: translateY(0);
      }

      /* Form Navigation */
      .form-navigation {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 1.5rem 2.5rem;
        background: #f8fafc;
        border-top: 1px solid var(--border);
      }
      
      .btn {
        padding: 0.875rem 2rem;
        border-radius: 12px;
        font-weight: 600;
        font-size: 0.95rem;
        transition: all 0.2s ease;
        border: none;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        text-decoration: none;
        min-width: 120px;
        justify-content: center;
      }
      
      .btn-primary {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
      }
      
      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
      }
      
      .btn-secondary {
        background: var(--surface);
        color: var(--text-secondary);
        border: 2px solid var(--border);
      }
      
      .btn-secondary:hover {
        border-color: var(--border-hover);
        color: var(--text-primary);
        transform: translateY(-1px);
      }
      
      /* Responsive Adjustments */
      @media (min-width: 768px) {
        .mobile-nav {
          display: none;
        }
        
        .sidebar-menu,
        .menu-overlay,
        .user-dropdown-mobile {
          display: none;
        }
      }
      
      @media (max-width: 767px) {
        #navbar {
          display: none;
        }
        
        body {
          padding-top: 80px;
        }
        
        .modern-form-container {
          padding: 1rem;
          margin-top: 1rem;
        }
        
        .form-header {
          margin-bottom: 1rem;
        }
        
        .form-title h2 {
          font-size: 1.5rem;
        }
        
        .form-content {
          padding: 1.5rem;
        }
        
        .form-navigation {
          padding: 1rem 1.5rem;
          flex-direction: column;
          gap: 1rem;
        }
        
        .btn {
          width: 100%;
        }
        
        .floating-label {
          margin-bottom: 1.5rem;
        }

        .date-selection-grid {
          grid-template-columns: 1fr;
          gap: 1rem;
          padding: 1rem;
        }

        .form-input {
          padding: 0.75rem;
          font-size: 0.95rem;
        }
      }
      
      @media (max-width: 480px) {
        .sidebar-menu {
          width: 260px;
        }
        
        .modern-form-container {
          padding: 0.5rem;
        }
        
        .form-title h2 {
          font-size: 1.3rem;
        }
        
        .form-content {
          padding: 1rem;
        }
        
        .floating-label input,
        .floating-label select {
          padding: 1rem 0.75rem 0.6rem 0.75rem;
          font-size: 0.95rem;
        }
        
        .floating-text {
          font-size: 0.9rem;
        }

        .date-selection-grid {
          padding: 0.75rem;
        }

        .form-label {
          font-size: 0.85rem;
        }

        .form-input {
          padding: 0.6rem 0.75rem;
          font-size: 0.9rem;
        }
      }
    </style>
</head>

    <script>
      // Initialize form on page load
      document.addEventListener('DOMContentLoaded', function() {
        setDefaultYearMonthDay();
        initFloatingLabels();
        initDateFields();
      });

      // Set default year and month
      function setDefaultYearMonthDay() {
        const now = new Date();
        document.getElementById('anio').value = now.getFullYear();
        document.getElementById('mes').value = (now.getMonth() + 1).toString();
        document.getElementById('dia').value = now.getDate();
        
        // Trigger floating label animation
        triggerFloatingLabels();
      }

      // Initialize floating labels (only for non-date fields)
      function initFloatingLabels() {
        const inputs = document.querySelectorAll('.floating-label input, .floating-label select');
        inputs.forEach(input => {
          // Check if input has value on load
          if (input.value) {
            input.parentElement.classList.add('has-value');
          }
          
          // Add event listeners
          input.addEventListener('focus', function() {
            this.parentElement.classList.add('focused');
          });
          
          input.addEventListener('blur', function() {
            this.parentElement.classList.remove('focused');
            if (this.value) {
              this.parentElement.classList.add('has-value');
            } else {
              this.parentElement.classList.remove('has-value');
            }
          });
          
          input.addEventListener('input', function() {
            if (this.value) {
              this.parentElement.classList.add('has-value');
            } else {
              this.parentElement.classList.remove('has-value');
            }
          });
        });
      }

      function triggerFloatingLabels() {
        const inputs = document.querySelectorAll('.floating-label input, .floating-label select');
        inputs.forEach(input => {
          if (input.value) {
            input.parentElement.classList.add('has-value');
          }
        });
      }

      // Initialize date field enhancements
      function initDateFields() {
        const dateInputs = document.querySelectorAll('.form-input');
        dateInputs.forEach(input => {
          input.addEventListener('focus', function() {
            this.parentElement.classList.add('focused');
          });
          
          input.addEventListener('blur', function() {
            this.parentElement.classList.remove('focused');
          });
        });
      }


      document.getElementById('addHoursForm').onsubmit = async function(e) {
        e.preventDefault();
        const form = e.target;
        const formData = new FormData(form);
        // Mostrar mensaje de estado
        let msg = document.getElementById('msg-estado');
        if (!msg) {
          msg = document.createElement('div');
          msg.id = 'msg-estado';
          msg.style.marginTop = '1rem';
          msg.style.fontWeight = 'bold';
          form.parentNode.appendChild(msg);
        }
        msg.textContent = 'Enviando...';
        msg.style.color = '#555';
        try {
          const token = localStorage.getItem('access_token');
          if (!token) {
            msg.textContent = 'No autenticado. Por favor, inicie sesión.';
            msg.style.color = 'red';
            setTimeout(() => { window.location.href = 'index.html'; }, 1500);
            return;
          }
          // Convertir FormData a objeto para JSON
          const data = {};
          formData.forEach((value, key) => { data[key] = value; });
          const response = await fetch(API_URLS.cooperativa.horas(), {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': 'Bearer ' + token
            },
            body: JSON.stringify(data)
          });
          if (response.ok) {
            msg.textContent = '¡Horas registradas exitosamente!';
            msg.style.color = 'green';
            setTimeout(() => { window.location.href = 'HorasMensuales.html'; }, 1200);
          } else {
            let errorMsg = 'Error al registrar horas';
            try {
              const text = await response.text();
              const data = JSON.parse(text);
              if (data && data.error) errorMsg += ': ' + data.error;
              else errorMsg += ': ' + text;
            } catch {
              // Si no es JSON
            }
            msg.textContent = errorMsg;
            msg.style.color = 'red';
          }
        } catch (err) {
          msg.textContent = 'Error de conexión con el servidor';
          msg.style.color = 'red';
          console.error('Error de red o JS:', err);
        }
      };

      document.getElementById('btnJustificacion').onclick = function() {
        window.location.href = 'AgregarJustificacion.html';
      };
      
      // Mobile Navigation Functions
      function toggleMenu() {
        const sidebarMenu = document.getElementById('sidebarMenu');
        const menuOverlay = document.getElementById('menuOverlay');
        
        sidebarMenu.classList.toggle('open');
        menuOverlay.classList.toggle('active');
      }
      
      function closeMenu() {
        const sidebarMenu = document.getElementById('sidebarMenu');
        const menuOverlay = document.getElementById('menuOverlay');
        
        sidebarMenu.classList.remove('open');
        menuOverlay.classList.remove('active');
      }
      
      function toggleUserDropdown() {
        const dropdown = document.getElementById('userDropdownMobile');
        dropdown.classList.toggle('show');
      }
      
      function logout() {
        alert('Cerrando sesión...');
        // Aquí iría la lógica de logout
        window.location.href = 'login.html';
      }
      
      // Close dropdown when clicking outside
      document.addEventListener('click', function(event) {
        const userIcon = document.getElementById('userIconMobile');
        const dropdown = document.getElementById('userDropdownMobile');
        
        if (!userIcon.contains(event.target) && !dropdown.contains(event.target)) {
          dropdown.classList.remove('show');
        }
      });
      
      // Close menu when clicking menu links
      document.querySelectorAll('.sidebar-nav a').forEach(link => {
        link.addEventListener('click', closeMenu);
      });
    </script>
