<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Completar Datos</title>
  <link rel="icon" type="image/jpeg" href="img/Logo.jpg">
  <link rel="stylesheet" href="Styles/CompletarDatos.css" />
  
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="Styles/HideScrollbar.css">
  <link rel="stylesheet" href="Styles/AntiFlash.css">
  <link rel="stylesheet" href="Styles/PageLoader.css">
  <link rel="stylesheet" href="Styles/NavbarSkeleton.css">
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
  
  <script src="JavaScript/theme.js"></script>
  
  <script src="JavaScript/i18n.js"></script>
 
</head>
<body>
  <div class="completar-container">
    <div class="completar-header">
      <h1><i class="bi bi-person-check me-2"></i><span data-i18n="profile.completeYourData">Completa tus datos</span></h1>
      <p data-i18n="profile.activateAccountMessage">Para activar tu cuenta, por favor completa todos los datos requeridos</p>
    </div>
    
    <div class="completar-content">
      <form id="completarDatosForm">
      <div class="form-group">
        <label for="nombre"><i class="bi bi-person me-1"></i><span data-i18n="profile.name">Nombre:</span></label>
        <input type="text" id="nombre" name="nombre" required readonly>
      </div>
      <div class="form-group">
        <label for="apellido"><i class="bi bi-person me-1"></i><span data-i18n="profile.lastName">Apellido:</span></label>
        <input type="text" id="apellido" name="apellido" required readonly>
      </div>
      <div class="form-group">
        <label for="email"><i class="bi bi-envelope me-1"></i><span data-i18n="profile.email">Email:</span></label>
        <input type="email" id="email" name="email" required readonly>
      </div>
      <div class="form-group">
        <label for="ci"><i class="bi bi-card-text me-1"></i><span data-i18n="profile.idCard">Cédula de Identidad:</span></label>
        <input type="text" id="ci" name="ci" required readonly>
      </div>
      <div class="form-group">
        <label for="telefono"><i class="bi bi-telephone me-1"></i><span data-i18n="profile.phone">Teléfono:</span></label>
        <input type="text" id="telefono" name="telefono" required>
      </div>
      <div class="form-group">
        <label for="direccion"><i class="bi bi-geo-alt me-1"></i><span data-i18n="profile.address">Dirección:</span></label>
        <input type="text" id="direccion" name="direccion" required>
      </div>
      <div class="form-group">
        <label for="estadoCivil"><i class="bi bi-heart me-1"></i><span data-i18n="profile.maritalStatus">Estado Civil:</span></label>
        <input type="text" id="estadoCivil" name="estadoCivil">
      </div>
      <div class="form-group">
        <label for="genero"><i class="bi bi-person me-1"></i><span data-i18n="profile.gender">Género:</span></label>
        <input type="text" id="genero" name="genero">
      </div>
      <div class="form-group">
        <label for="fechaNacimiento"><i class="bi bi-calendar3 me-1"></i><span data-i18n="profile.birthDate">Fecha de Nacimiento:</span></label>
        <input type="date" id="fechaNacimiento" name="fechaNacimiento" required>
      </div>
      <div class="form-group">
        <label for="ocupacion"><i class="bi bi-briefcase me-1"></i><span data-i18n="profile.occupation">Ocupación:</span></label>
        <input type="text" id="ocupacion" name="ocupacion">
      </div>
      <div class="form-group">
        <label for="nacionalidad"><i class="bi bi-flag me-1"></i><span data-i18n="profile.nationality">Nacionalidad:</span></label>
        <input type="text" id="nacionalidad" name="nacionalidad">
      </div>
      <button type="submit" class="btn">
        <i class="bi bi-check-circle me-2"></i><span data-i18n="profile.saveAndActivate">Guardar y Activar Cuenta</span>
      </button>
    </form>
    <div id="mensaje"></div>
  </div>
  </div>
  <script src="JavaScript/loader.js"></script>
    <script src="JavaScript/universal-loader.js"></script>
  <script src="JavaScript/navbar-skeleton.js"></script>
  <script src="JavaScript/page-loader.js"></script>
  <script src="JavaScript/config.js"></script>
  <script src="JavaScript/completarDatos.js"></script>
  
</body>
</html>
