<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard</title>
  <link rel="stylesheet" href="styles.css">
  
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
  
  <!-- Google Fonts - Poppins -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    /* CSS Variables - Tema principal */
    :root {
      --primary: #6792fd;
      --primary-light: #8ba6ff;
      --primary-dark: #4c6fd1;
      --secondary: #f8fafc;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --dark: #1e293b;
      --light: #f1f5f9;
      --white: #ffffff;
      --text-primary: #0f172a;
      --text-secondary: #64748b;
      --border-light: #e2e8f0;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      --radius-sm: 0.5rem;
      --radius-md: 0.75rem;
      --radius-lg: 1rem;
    }

    html, body {
      overflow-x: hidden;
      height: 100%;
      width: 100%;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #FFC1E3 0%, #A3D8F4 100%);
      min-height: 100vh;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    *, *::before, *::after {
      box-sizing: border-box;
    }
    
    main {
      padding: 2rem 3rem;
      margin: 0;
      width: 100%;
      max-width: 100%;
      box-sizing: border-box;
    }

    /* Layout Principal - Dos Columnas */
    .dashboard-container {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 24px 32px 24px 32px;
      min-width: 350px;
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 2rem;
      width: 100%;
      height: auto;
      align-items: start;
    }

    /* Columna Principal (Izquierda) */
    .main-content {
      display: flex;
      flex-direction: column;
      gap: 2rem;
      width: 100%;
      min-width: 0;
    }

    /* Sidebar (Derecha) */
    .dashboard-sidebar {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      width: 100%;
      min-width: 0;
    }

    /* Cards Base */
    .card-base {
      background: var(--white);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border-light);
      transition: all 0.3s ease;
    }

    .card-base:hover {
      box-shadow: var(--shadow-lg);
      transform: translateY(-2px);
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .card-title i {
      color: var(--primary);
      font-size: 1.1em;
    }

    /* Sección Evolución */
    .evolution-section {
      background: var(--white);
      border-radius: var(--radius-lg);
      padding: 2.5rem;
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border-light);
      transition: all 0.3s ease;
    }
    
    .evolution-section:hover {
      box-shadow: var(--shadow-lg);
    }

    .evolution-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2rem;
      margin-top: 2rem;
    }

    .evolution-card {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
      border-radius: var(--radius-md);
      padding: 2rem 1.5rem;
      color: var(--white);
      text-align: center;
      transition: all 0.3s ease;
      min-height: 120px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .evolution-card:hover {
      transform: scale(1.05);
    }

    .evolution-card h3 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .evolution-card p {
      font-size: 0.9rem;
      opacity: 0.9;
      margin: 0;
    }

    /* Mission & Vision Cards */
    .mission-vision-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
    }

    .mission-card, .vision-card {
      background: var(--white);
      border-radius: var(--radius-lg);
      padding: 2.5rem;
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border-light);
      transition: all 0.3s ease;
      min-height: 180px;
      display: flex;
      flex-direction: column;
    }

    .mission-card:hover, .vision-card:hover {
      box-shadow: var(--shadow-lg);
      transform: translateY(-2px);
    }

    .mission-card .card-title {
      color: var(--success);
    }

    .vision-card .card-title {
      color: var(--warning);
    }

    /* Contact Section */
    .contact-section {
      background: linear-gradient(135deg, var(--dark) 0%, var(--text-primary) 100%);
      border-radius: var(--radius-lg);
      padding: 2.5rem;
      color: var(--white);
      box-shadow: var(--shadow-md);
      transition: all 0.3s ease;
    }
    
    .contact-section:hover {
      box-shadow: var(--shadow-lg);
    }

    .contact-info {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 2rem;
      margin-top: 2rem;
    }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .contact-item i {
      font-size: 1.2rem;
      color: var(--primary-light);
    }

    /* Widgets del Sidebar */
    .widget {
      background: var(--white);
      border-radius: var(--radius-lg);
      padding: 2rem;
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border-light);
      transition: all 0.3s ease;
    }
    
    .widget:hover {
      box-shadow: var(--shadow-lg);
      transform: translateY(-2px);
    }

    .widget-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--border-light);
    }

    .widget-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .widget-title i {
      color: var(--primary);
    }

    /* Widget: Novedades */
    .news-item {
      padding: 0.75rem 0;
      border-bottom: 1px solid var(--border-light);
    }

    .news-item:last-child {
      border-bottom: none;
    }

    .news-title {
      font-weight: 500;
      color: var(--text-primary);
      font-size: 0.9rem;
      margin-bottom: 0.25rem;
    }

    .news-date {
      font-size: 0.8rem;
      color: var(--text-secondary);
    }

    /* Widget: Horas Mensuales */
    .hours-display {
      text-align: center;
      padding: 1rem 0;
    }

    .hours-number {
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--primary);
      display: block;
    }

    .hours-label {
      font-size: 0.9rem;
      color: var(--text-secondary);
      margin-top: 0.5rem;
    }

    .hours-progress {
      background: var(--light);
      border-radius: 50px;
      height: 8px;
      overflow: hidden;
      margin-top: 1rem;
    }

    .hours-progress-bar {
      background: linear-gradient(90deg, var(--primary) 0%, var(--primary-light) 100%);
      height: 100%;
      transition: width 0.3s ease;
    }



    /* Loading & Error States */
    .skeleton {
      background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
      background-size: 200% 100%;
      animation: loading 1.5s infinite;
      border-radius: var(--radius-sm);
    }

    @keyframes loading {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .skeleton-text {
      height: 1rem;
      margin-bottom: 0.5rem;
    }

    .skeleton-title {
      height: 1.5rem;
      width: 60%;
      margin-bottom: 1rem;
    }

    .skeleton-card {
      height: 120px;
    }

    .error-state {
      text-align: center;
      padding: 2rem;
      color: var(--text-secondary);
    }

    .error-state i {
      font-size: 3rem;
      color: var(--danger);
      margin-bottom: 1rem;
    }

    .retry-btn {
      background: var(--primary);
      color: var(--white);
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: var(--radius-sm);
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s ease;
      margin-top: 1rem;
    }

    .retry-btn:hover {
      background: var(--primary-dark);
    }
    
    /* Mejoras adicionales para desktop */
    @media (min-width: 768px) {
      .widget {
        min-height: 140px;
      }
      
      .card-title, .widget-title {
        line-height: 1.2;
      }
    }
    
    /* Responsive Design */
    @media (min-width: 768px) {
      main {
        padding: 2rem 4rem;
      }
      
      .dashboard-grid {
        gap: 3rem;
      }
    }
    
    /* Desktop grande */
    @media (min-width: 1200px) {
      main {
        padding: 3rem 6rem;
      }
      
      .dashboard-grid {
        gap: 4rem;
      }
    }
    
    /* Pantallas muy grandes */
    @media (min-width: 1600px) {
      main {
        padding: 3rem 8rem;
      }
      
      .dashboard-container {
        max-width: 1600px;
      }
      
      .dashboard-grid {
        gap: 5rem;
      }
    }
    
    @media (max-width: 1024px) and (min-width: 768px) {
      main {
        padding: 2rem 3rem;
      }
      
      .dashboard-grid {
        grid-template-columns: 1.8fr 1fr;
        gap: 2rem;
      }
      
      .evolution-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 1.5rem;
      }
      
      .evolution-card {
        padding: 1.5rem;
        min-height: 100px;
      }
      
      .mission-card, .vision-card {
        padding: 2rem;
        min-height: 160px;
      }
    }
    
    @media (max-width: 768px) {
      #navbar {
        display: none;
      }
      
      body {
        padding-top: 70px;
      }
      
      main {
        padding: 1rem 1.5rem;
      }
      
      .dashboard-grid {
        grid-template-columns: 1fr;
        gap: 1.5rem;
      }
      
      .dashboard-sidebar {
        position: static;
        order: 2;
      }
      
      .evolution-grid {
        grid-template-columns: 1fr;
      }
      
      .mission-vision-grid {
        grid-template-columns: 1fr;
        gap: 1rem;
      }
      
      .contact-info {
        grid-template-columns: 1fr;
        gap: 1rem;
      }
      
      .evolution-section,
      .mission-card,
      .vision-card,
      .contact-section,
      .widget {
        padding: 1.5rem;
      }
    }
    
    @media (max-width: 480px) {
      main {
        padding: 1rem 1.25rem;
      }
      
      .evolution-section,
      .mission-card,
      .vision-card,
      .contact-section,
      .widget {
        padding: 1rem;
      }
      
      .sidebar-menu {
        width: 260px;
      }
      
      .evolution-card {
        padding: 1rem;
      }
      
      .evolution-card h3 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>

  <main>

      <div class="dashboard-grid">

  </main>

    <script src="JavaScript/config.js"></script>
    <script src="JavaScript/dashboard.js"></script>
  <script src="JavaScript/loader.js"></script>
  <script src="JavaScript/navbar-loader.js"></script>
  <script>
    /**
     * Dashboard Data Management
     * Hooks para consumir APIs y manejar estados de loading/error
     */
    
    // API Endpoints
    const DASHBOARD_API = {
      evolution: '/api/dashboard/evolution',
      missionVision: '/api/dashboard/mission-vision', 
      news: '/api/dashboard/news',
      hours: API_URLS.cooperativa.dashboardHoras() // Usar endpoint real
    };

    /**
     * Utility function para hacer requests con manejo de errores
     */
    async function fetchWithAuth(url, options = {}) {
      const token = localStorage.getItem('access_token');
      const defaultOptions = {
        headers: {
          'Authorization': `Bearer ${token}`,
          'Accept': 'application/json',
          'Content-Type': 'application/json',
          ...options.headers
        },
        ...options
      };

      try {
        const response = await fetch(url, defaultOptions);
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        return await response.json();
      } catch (error) {
        console.error('Fetch error:', error);
        throw error;
      }
    }

    /**
     * Hook: Cargar datos de evolución
     */
    async function loadEvolutionData() {
      const container = document.getElementById('evolutionGrid');
      
      try {
        // Simular delay para mostrar loading
        await new Promise(resolve => setTimeout(resolve, 1000));
        
        // En un entorno real, descomentar esta línea:
        // const data = await fetchWithAuth(DASHBOARD_API.evolution);
        
        // Datos mock para demostración
        const data = {
          metrics: [
            { title: '2,450', subtitle: 'Asociados Activos', icon: 'people' },
            { title: '156', subtitle: 'Proyectos', icon: 'briefcase' },
            { title: '98%', subtitle: 'Satisfacción', icon: 'award' }
          ]
        };

        container.innerHTML = data.metrics.map(metric => `
          <div class="evolution-card">
            <h3>${metric.title}</h3>
            <p>${metric.subtitle}</p>
          </div>
        `).join('');

      } catch (error) {
        showError(container, 'Error al cargar datos de evolución', () => loadEvolutionData());
      }
    }

    /**
     * Hook: Cargar misión y visión
     */
    async function loadMissionVisionData() {
      const missionContent = document.getElementById('missionContent');
      const visionContent = document.getElementById('visionContent');
      
      try {
        await new Promise(resolve => setTimeout(resolve, 800));
        
        // const data = await fetchWithAuth(DASHBOARD_API.missionVision);
        
        // Datos mock
        const data = {
          mission: 'Promover la participación activa y transparente de todos los asociados, fomentando el desarrollo económico y social de nuestra comunidad.',
          vision: 'Ser un referente de gestión comunitaria eficiente y justa, contribuyendo al bienestar y progreso de nuestros miembros.'
        };

        missionContent.innerHTML = `<p>${data.mission}</p>`;
        visionContent.innerHTML = `<p>${data.vision}</p>`;

      } catch (error) {
        showError(missionContent, 'Error al cargar misión', () => loadMissionVisionData());
        showError(visionContent, 'Error al cargar visión', () => loadMissionVisionData());
      }
    }

    /**
     * Hook: Cargar novedades
     */
    async function loadNewsData() {
      const container = document.getElementById('newsContent');
      
      try {
        await new Promise(resolve => setTimeout(resolve, 600));
        
        // const data = await fetchWithAuth(DASHBOARD_API.news);
        
        // Datos mock
        const data = {
          news: [
            { 
              title: 'Asamblea General Ordinaria',
              date: '2025-10-20',
              summary: 'Convocatoria para el 25 de octubre'
            },
            { 
              title: 'Nuevo Sistema de Pagos',
              date: '2025-10-15',
              summary: 'Implementación de pagos digitales'
            },
            { 
              title: 'Capacitación Digital',
              date: '2025-10-10',
              summary: 'Curso gratuito para asociados'
            }
          ]
        };

        container.innerHTML = data.news.map(item => `
          <div class="news-item">
            <div class="news-title">${item.title}</div>
            <div class="news-date">${formatDate(item.date)}</div>
          </div>
        `).join('');

      } catch (error) {
        showError(container, 'Error al cargar novedades', () => loadNewsData());
      }
    }

    /**
     * Hook: Cargar horas mensuales - CONECTADO A API REAL
     */
    async function loadHoursData() {
      const hoursNumber = document.getElementById('hoursNumber');
      const hoursProgress = document.getElementById('hoursProgress');
      const container = document.getElementById('hoursContent');
      
      try {
        const token = localStorage.getItem('access_token');
        if (!token) {
          throw new Error('No hay token de autenticación');
        }

        const now = new Date();
        const mes = now.getMonth() + 1;
        const anio = now.getFullYear();

        // Llamar al endpoint optimizado de dashboard-horas
        const response = await fetch(API_URLS.cooperativa.dashboardHoras(mes, anio), {
          headers: {
            'Authorization': 'Bearer ' + token,
            'Accept': 'application/json'
          }
        });

        if (!response.ok) {
          throw new Error(`Error ${response.status}: ${response.statusText}`);
        }

        const dashboardData = await response.json();
        console.log('Dashboard horas cargado:', dashboardData);

        // Extraer datos del resumen
        const resumen = dashboardData.resumen || {};
        const progreso = dashboardData.progreso;

        // Actualizar widget de horas
        const totalHoras = resumen.total_horas || 0;
        const horasReales = resumen.horas_reales || 0;
        const horasJustificadas = resumen.horas_justificadas || 0;
        const horasRequeridas = progreso ? progreso.horas_requeridas : null;
        const porcentaje = progreso ? progreso.porcentaje : 0;

        // Actualizar interfaz
        if (hoursNumber) {
          hoursNumber.textContent = Math.round(totalHoras);
          
          // Agregar tooltip con desglose si hay horas justificadas
          if (horasJustificadas > 0) {
            hoursNumber.title = `${Math.round(horasReales)}h trabajadas + ${Math.round(horasJustificadas)}h justificadas`;
          } else {
            hoursNumber.title = `${Math.round(horasReales)}h trabajadas`;
          }
        }
        
        if (hoursProgress) {
          hoursProgress.style.width = `${Math.min(porcentaje, 100)}%`;
        }

        // Actualizar texto del progreso
        const progressText = document.querySelector('.hours-label');
        if (progressText) {
          if (progreso) {
            if (progreso.completado) {
              progressText.textContent = '¡Meta completada!';
              progressText.style.color = 'var(--success)';
              progressText.style.fontWeight = '600';
            } else {
              const horasRestantes = Math.max(0, horasRequeridas - totalHoras);
              progressText.textContent = `de ${horasRequeridas}h • Faltan ${Math.round(horasRestantes)}h`;
              progressText.style.color = 'var(--text-secondary)';
              progressText.style.fontWeight = 'normal';
            }
          } else {
            progressText.textContent = 'horas registradas este mes';
            progressText.style.color = 'var(--text-secondary)';
            progressText.style.fontWeight = 'normal';
          }
        }

        // Cambiar color de la barra según progreso
        if (hoursProgress && progreso) {
          if (progreso.completado) {
            hoursProgress.style.background = 'linear-gradient(90deg, var(--success) 0%, #22c55e 100%)';
          } else if (porcentaje >= 75) {
            hoursProgress.style.background = 'linear-gradient(90deg, var(--info) 0%, #60a5fa 100%)';
          } else if (porcentaje >= 50) {
            hoursProgress.style.background = 'linear-gradient(90deg, var(--warning) 0%, #fbbf24 100%)';
          } else {
            hoursProgress.style.background = 'linear-gradient(90deg, var(--primary) 0%, var(--primary-light) 100%)';
          }
        }

        console.log('Widget horas actualizado:', {
          totalHoras,
          horasRequeridas,
          porcentaje: Math.round(porcentaje)
        });

      } catch (error) {
        console.error('Error al cargar horas del dashboard:', error);
        
        // Mostrar valores por defecto en caso de error
        if (hoursNumber) {
          hoursNumber.textContent = '--';
          hoursNumber.title = 'Error al cargar datos';
        }
        
        if (hoursProgress) {
          hoursProgress.style.width = '0%';
        }
        
        const progressText = document.querySelector('.hours-label');
        if (progressText) {
          progressText.textContent = 'Error al cargar datos';
          progressText.style.color = 'var(--danger)';
        }
        
        // Log detallado para debugging
        console.error('Detalles del error:', {
          message: error.message,
          stack: error.stack,
          endpoint: API_URLS.cooperativa.dashboardHoras(new Date().getMonth() + 1, new Date().getFullYear())
        });
        
        showError(container, `No se pudieron cargar las horas: ${error.message}`, () => loadHoursData());
      }
    }



    /**
     * Mostrar estado de error con botón reintentar
     */
    function showError(container, message, retryCallback) {
      container.innerHTML = `
        <div class="error-state">
          <i class="bi bi-exclamation-triangle"></i>
          <p>${message}</p>
          <button class="retry-btn" onclick="retryCallback()">
            <i class="bi bi-arrow-clockwise"></i> Reintentar
          </button>
        </div>
      `;
      
      // Hacer la función de reintento disponible globalmente
      window.retryCallback = retryCallback;
    }

    /**
     * Utilities para formateo
     */
    function formatDate(dateString) {
      const date = new Date(dateString);
      return date.toLocaleDateString('es-AR', { 
        day: 'numeric', 
        month: 'short', 
        year: 'numeric' 
      });
    }

    function formatCurrency(amount) {
      return new Intl.NumberFormat('es-AR', {
        minimumFractionDigits: 0,
        maximumFractionDigits: 0
      }).format(amount);
    }

    /**
     * Inicialización del Dashboard
     */
    async function initDashboard() {
      // Cargar todos los datos en paralelo
      await Promise.allSettled([
        loadEvolutionData(),
        loadMissionVisionData(), 
        loadNewsData(),
        loadHoursData()
      ]);
    }

    // Validación de token y estado de usuario al cargar el dashboard
    document.addEventListener('DOMContentLoaded', async function() {
      const token = localStorage.getItem('access_token');
      if (!token) {
        window.location.href = 'index.html';
        return;
      }
      
      try {
        const res = await fetch(API_URLS.usuarios.validate(), {
          headers: {
            'Authorization': 'Bearer ' + token,
            'Accept': 'application/json'
          }
        });
        if (!res.ok) throw new Error('No se pudo validar el token');
        const data = await res.json();
        
        // Si el usuario tiene estadoRegistro 'Inactivo', muestra alerta y redirige
        if (data.persona && data.persona.estadoRegistro === 'Inactivo') {
          alert('Debes completar todos tus datos');
          window.location.href = 'completarDatos.html';
          return;
        }
        
        // Si el usuario no está aceptado, redirige a login
        if (data.persona && data.persona.estadoRegistro !== 'Aceptado') {
          window.location.href = 'index.html';
          return;
        }
        
        // Inicializar dashboard después de validar usuario
        await initDashboard();
        
      } catch (err) {
        console.error('Error validating user:', err);
        window.location.href = 'index.html';
      }
    });
    
    // Logout function (mantenida para compatibilidad)
    function logout() {
      localStorage.removeItem('access_token');
      window.location.href = 'index.html';
    }
  </script>

</body>
