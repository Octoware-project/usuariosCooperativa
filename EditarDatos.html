<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar Datos Personales</title>
  <link rel="icon" type="image/jpeg" href="img/Logo.jpg">
  
  <style id="theme-vars">
    :root {
      --primary: #ec4899;
      --primary-rgb: 236, 72, 153;
      --primary-light: #f472b6;
      --primary-dark: #db2777;
      --surface: #1e2128;
      --surface-variant: #282c34;
      --surface-hover: #2d3139;
      --bg-gradient: linear-gradient(135deg, #1e2128 0%, #282c34 100%);
      --text-primary: #e4e4e7;
      --text-secondary: #d1d5db;
      --text-muted: #9ca3af;
      --border: #3f3f46;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.4);
      --shadow-lg: none;
      --shadow-xl: none;
      --success: #10b981;
      --warning: #f59e0b;
      --error: #ef4444;
      --info: #ec4899;
      --btn-primary-bg: #ec4899;
      --btn-primary-hover: #f472b6;
      --navbar-bg: rgba(30, 33, 40, 0.98);
      --navbar-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
      --navbar-border: rgba(63, 63, 70, 0.5);
      --sidebar-bg: #1e2128;
      --sidebar-header-bg: linear-gradient(135deg, #ec4899 0%, #f472b6 100%);
      --sidebar-hover: rgba(236, 72, 153, 0.15);
      --sidebar-text: #e4e4e7;
      --sidebar-divider: #3f3f46;
      --header-bg: linear-gradient(135deg, #ec4899 0%, #db2777 100%);
      --content-bg: #282c34;
    }
  </style>
  <script>
    (function() {
      const savedTheme = localStorage.getItem('theme') || 'dark';
      if (savedTheme === 'light') {
        const lightTheme = {
          '--primary': '#d946a6',
          '--primary-rgb': '217, 70, 166',
          '--primary-light': '#f3e8f8',
          '--primary-dark': '#b8388a',
          '--surface': '#ffffff',
          '--surface-variant': '#f8f9fa',
          '--surface-hover': '#f0f0f0',
          '--bg-gradient': '#ffffff',
          '--text-primary': '#1f2937',
          '--text-secondary': '#6b7280',
          '--text-muted': '#9ca3af',
          '--border': '#e5e7eb',
          '--shadow-sm': '0 1px 2px rgba(0, 0, 0, 0.05)',
          '--shadow-md': '0 4px 6px rgba(0, 0, 0, 0.1)',
          '--shadow-lg': 'none',
          '--shadow-xl': 'none',
          '--success': '#10b981',
          '--warning': '#f59e0b',
          '--error': '#ef4444',
          '--info': '#3b82f6',
          '--btn-primary-bg': '#d946a6',
          '--btn-primary-hover': '#b8388a',
          '--navbar-bg': 'rgba(255, 255, 255, 0.98)',
          '--navbar-shadow': '0 2px 10px rgba(0, 0, 0, 0.05)',
          '--navbar-border': 'rgba(226, 232, 240, 0.5)',
          '--sidebar-bg': '#ffffff',
          '--sidebar-header-bg': 'linear-gradient(135deg, #f9a8d4 0%, #ec4899 100%)',
          '--sidebar-hover': 'rgba(217, 70, 166, 0.08)',
          '--sidebar-text': '#334155',
          '--sidebar-divider': '#e2e8f0',
          '--header-bg': 'linear-gradient(135deg, #f9a8d4 0%, #c084fc 100%)',
          '--content-bg': '#fafafa'
        };
        Object.entries(lightTheme).forEach(([key, value]) => {
          document.documentElement.style.setProperty(key, value);
        });
      }
    })();
  </script>
  
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
  
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="Styles/HideScrollbar.css">
  <link rel="stylesheet" href="Styles/AntiFlash.css">
  <link rel="stylesheet" href="Styles/PageLoader.css">
  <link rel="stylesheet" href="Styles/NavbarSkeleton.css">
  <link rel="stylesheet" href="Styles/Navbar.css">
  
  <script src="JavaScript/theme.js"></script>
  
  <script src="JavaScript/i18n.js"></script>

  <link rel="stylesheet" href="Styles/EditarDatos.css">
</head>
<body>

  <div id="navbar"></div>
  
  <div class="edit-container">
    <div class="edit-card">
      <div class="edit-header">
        <h2><i class="bi bi-person-gear me-2"></i> <span data-i18n="profile.editPersonalData">Editar Datos Personales</span></h2>
        <div class="subtitle" data-i18n="profile.updateYourInfo">Actualiza tu informaci�n personal</div>
      </div>
      
      <div class="edit-content">
        <div class="section-card">
          <form id="editDatosForm">
            <div class="row">
              <div class="col-md-6">
                <label for="telefono" class="form-label">
                  <i class="bi bi-telephone me-1"></i><span data-i18n="profile.phone">Tel�fono</span>
                </label>
                <input type="text" class="form-control" id="telefono" name="telefono" required>
              </div>
              
              <div class="col-md-6">
                <label for="genero" class="form-label">
                  <i class="bi bi-person me-1"></i><span data-i18n="profile.gender">G�nero</span>
                </label>
                <select class="form-control" id="genero" name="genero" required>
                  <option value="" data-i18n="profile.selectGender">Seleccionar g�nero</option>
                  <option value="Masculino" data-i18n="profile.male">Masculino</option>
                  <option value="Femenino" data-i18n="profile.female">Femenino</option>
                  <option value="Otro" data-i18n="profile.other">Otro</option>
                </select>
              </div>
            </div>
            
            <div class="row">
              <div class="col-md-6">
                <label for="fechaNacimiento" class="form-label">
                  <i class="bi bi-calendar3 me-1"></i><span data-i18n="profile.birth_date">Fecha de Nacimiento</span>
                </label>
                <input type="date" class="form-control" id="fechaNacimiento" name="fechaNacimiento" required>
              </div>
              
              <div class="col-md-6">
                <label for="estadoCivil" class="form-label">
                  <i class="bi bi-heart me-1"></i><span data-i18n="profile.civil_status">Estado Civil</span>
                </label>
                <select class="form-control" id="estadoCivil" name="estadoCivil" required>
                  <option value="" data-i18n="profile.selectCivilStatus">Seleccionar estado civil</option>
                  <option value="Soltero/a" data-i18n="profile.single">Soltero/a</option>
                  <option value="Casado/a" data-i18n="profile.married">Casado/a</option>
                  <option value="Divorciado/a" data-i18n="profile.divorced">Divorciado/a</option>
                  <option value="Viudo/a" data-i18n="profile.widowed">Viudo/a</option>
                  <option value="Uni�n libre" data-i18n="profile.commonLaw">Uni�n libre</option>
                </select>
              </div>
            </div>
            
            <div class="mb-3">
              <label for="direccion" class="form-label">
                <i class="bi bi-geo-alt me-1"></i><span data-i18n="profile.address">Direcci�n</span>
              </label>
              <input type="text" class="form-control" id="direccion" name="direccion" required>
            </div>
            
            <div class="row">
              <div class="col-md-6">
                <label for="ocupacion" class="form-label">
                  <i class="bi bi-briefcase me-1"></i><span data-i18n="profile.occupation">Ocupaci�n</span>
                </label>
                <input type="text" class="form-control" id="ocupacion" name="ocupacion" required>
              </div>
              
              <div class="col-md-6">
                <label for="nacionalidad" class="form-label">
                  <i class="bi bi-flag me-1"></i><span data-i18n="profile.nationality">Nacionalidad</span>
                </label>
                <input type="text" class="form-control" id="nacionalidad" name="nacionalidad" required>
              </div>
            </div>
            
            <div id="formError" class="alert alert-danger" style="display: none;"></div>
            <div id="formSuccess" class="alert alert-success" style="display: none;"></div>
            
            <div class="row mt-3">
              <div class="col-md-6">
                <button type="button" class="btn-cancel" onclick="window.history.back()">
                  <i class="bi bi-x-circle me-2"></i><span data-i18n="profile.cancel">Cancelar</span>
                </button>
              </div>
              <div class="col-md-6">
                <button type="submit" class="btn-save">
                  <i class="bi bi-check-circle me-2"></i><span data-i18n="profile.saveChanges">Guardar Cambios</span>
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

</body>
