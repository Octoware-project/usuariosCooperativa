<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editar Datos Personales</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .edit-form-container {
      max-width: 500px;
      margin: 40px auto;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 32px 24px;
    }
    .edit-form-container h2 {
      text-align: center;
      margin-bottom: 24px;
      color: #d81b60;
    }
    .edit-form label {
      font-weight: 600;
      margin-top: 12px;
      display: block;
    }
    .edit-form input, .edit-form select {
      width: 100%;
      padding: 8px 10px;
      margin-top: 4px;
      margin-bottom: 12px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 1rem;
    }
    .edit-form button {
      background: #d81b60;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 10px 22px;
      font-size: 1rem;
      font-weight: 600;
      width: 100%;
      margin-top: 10px;
      transition: background 0.2s;
    }
    .edit-form button:hover {
      background: #ad1457;
    }
    .edit-form .error {
      color: #d81b60;
      font-size: 0.95rem;
      margin-bottom: 8px;
    }
    .edit-form .success {
      color: #388e3c;
      font-size: 1rem;
      margin-bottom: 8px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="navbar"></div>
  <div class="edit-form-container">
    <h2>Editar Datos Personales</h2>
    <form id="editDatosForm" class="edit-form">
  <div style="height:1px;"></div>
      <label for="telefono">Teléfono</label>
      <input type="text" id="telefono" name="telefono" required>
      <label for="direccion">Dirección</label>
      <input type="text" id="direccion" name="direccion" required>
      <label for="estadoCivil">Estado Civil</label>
      <input type="text" id="estadoCivil" name="estadoCivil" required>
      <label for="genero">Género</label>
      <input type="text" id="genero" name="genero" required>
      <label for="fechaNacimiento">Fecha de Nacimiento</label>
      <input type="date" id="fechaNacimiento" name="fechaNacimiento" required>
      <label for="ocupacion">Ocupación</label>
      <input type="text" id="ocupacion" name="ocupacion" required>
      <label for="nacionalidad">Nacionalidad</label>
      <input type="text" id="nacionalidad" name="nacionalidad" required>
  <button type="submit">Guardar Cambios</button>
  <div class="error" id="formError" style="margin-top:8px;"></div>
  <div class="success" id="formSuccess" style="margin-top:8px;font-weight:bold;"></div>
    </form>
  </div>
  <script src="JavaScript/loader.js"></script>
  <script src="JavaScript/editarDatos.js"></script>
</body>
</html>
