<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cambiar Contraseña</title>
  <style>
    /* Reset básico */
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #FFC1E3 0%, #A3D8F4 100%);
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .container {
      background: #ffffff;
      width: 400px;
      padding: 3rem 2.5rem;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(255, 193, 227, 0.6);
      text-align: center;
      transition: box-shadow 0.3s ease;
    }
    h2 {
      color: #de5f88;
      margin-bottom: 2rem;
      font-weight: 700;
      letter-spacing: 1.2px;
      font-size: 2.2rem;
    }
    input[type="password"] {
      width: 100%;
      padding: 16px 20px;
      margin-bottom: 1.2rem;
      font-size: 1.1rem;
      border: 2.5px solid #A3D8F4;
      border-radius: 12px;
      transition: border-color 0.3s ease, background-color 0.3s ease, box-shadow 0.3s ease, transform 0.2s ease;
      display: block;
    }
    input[type="password"]:focus {
      outline: none;
      border-color: #de5f88;
      background-color: #fff0f6;
      box-shadow: 0 4px 12px rgba(222, 95, 136, 0.6);
      transform: translateY(-3px);
    }
    button {
      width: 100%;
      padding: 16px 0;
      background-color: #de5f88;
      border: none;
      border-radius: 12px;
      color: white;
      font-weight: 700;
      font-size: 1.15rem;
      cursor: pointer;
      transition: background-color 0.3s ease, transform 0.15s ease;
    }
    button:hover:not(:disabled) {
      background-color: #c94f76;
      transform: scale(1.05);
    }
    button:disabled {
      background-color: #f7a7c1;
      cursor: not-allowed;
    }
    .error, .success {
      margin-top: 1rem;
      min-height: 1.3rem;
      font-weight: 600;
      font-size: 0.95rem;
      user-select: none;
    }
    .error { color: #de5f88; }
    .success { color: #4ea9f7; }
    .loader {
      margin-top: 1rem;
      font-weight: 600;
      color: #4ea9f7;
      display: none;
      user-select: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Cambiar Contraseña</h2>
    <input type="password" id="oldPassword" placeholder="Contraseña actual" required />
    <input type="password" id="newPassword" placeholder="Nueva contraseña" required />
    <input type="password" id="confirmPassword" placeholder="Confirmar contraseña" required />
    <button id="btnCambiar">Cambiar Contraseña</button>
    <div class="loader" id="loader" style="display:none;">Procesando...</div>
    <div class="error" id="error"></div>
    <div class="success" id="success"></div>
  </div>
  <script>
    document.getElementById('btnCambiar').addEventListener('click', async function() {
      const oldPassword = document.getElementById('oldPassword').value.trim();
      const newPassword = document.getElementById('newPassword').value.trim();
      const confirmPassword = document.getElementById('confirmPassword').value.trim();
      const errorDiv = document.getElementById('error');
      const successDiv = document.getElementById('success');
      const loaderDiv = document.getElementById('loader');
      errorDiv.textContent = '';
      successDiv.textContent = '';

      if (!oldPassword || !newPassword || !confirmPassword) {
        errorDiv.textContent = 'Completa todos los campos.';
        return;
      }
      if (newPassword.length < 6) {
        errorDiv.textContent = 'La nueva contraseña debe tener al menos 6 caracteres.';
        return;
      }
      if (newPassword !== confirmPassword) {
        errorDiv.textContent = 'Las contraseñas no coinciden.';
        return;
      }

      const token = localStorage.getItem('access_token');
      if (!token) {
        window.location.href = 'login.html';
        return;
      }

      document.getElementById('btnCambiar').disabled = true;
      loaderDiv.style.display = 'block';

      try {
        const res = await fetch('http://127.0.0.1:8000/api/user/change-password', {
          method: 'POST',
          headers: {
            'Authorization': 'Bearer ' + token,
            'Accept': 'application/json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            old_password: oldPassword,
            new_password: newPassword,
            confirm_password: confirmPassword
          })
        });
        const data = await res.json();
        if (!res.ok) {
          let msg = data.message || 'Error al cambiar la contraseña';
          if (data.errors) {
            if (typeof data.errors === 'object') {
              msg += '<ul>';
              for (const key in data.errors) {
                msg += `<li>${data.errors[key]}</li>`;
              }
              msg += '</ul>';
            } else if (Array.isArray(data.errors)) {
              msg += '<ul>';
              data.errors.forEach(e => { msg += `<li>${e}</li>`; });
              msg += '</ul>';
            }
          }
          errorDiv.innerHTML = msg;
          throw new Error(msg);
        }
        successDiv.textContent = 'Contraseña cambiada exitosamente. Redirigiendo...';
        setTimeout(() => {
          window.location.href = 'login.html';
        }, 2000);
      } catch (err) {
        if (!errorDiv.innerHTML) errorDiv.textContent = err.message;
      } finally {
        document.getElementById('btnCambiar').disabled = false;
        loaderDiv.style.display = 'none';
      }
    });
  </script>
</body>
</html>
